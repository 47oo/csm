# Alembic 配置（F012）。
#
# 数据库 URL 不在此硬编码：由 backend/migrations/env.py 从应用配置
# （环境变量 CSM_DATABASE_URL / .env）读取，避免在版本库中保存生产密码。

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
path_separator = os
# 占位；env.py 会用应用配置覆盖。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S