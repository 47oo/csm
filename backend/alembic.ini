# Alembic configuration for CSM backend.
# The database URL is intentionally left empty here and injected by env.py
# from app.core.config.Settings (DB-D5). Do not put credentials in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# URL is provided programmatically by alembic/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S