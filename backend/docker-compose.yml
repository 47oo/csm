# CSM F013 后端部署（内网、HTTP-only；ADR-004）
#
# 用法：
#   CSM_INITIAL_ADMIN_USERNAME=admin CSM_INITIAL_ADMIN_PASSWORD='ChangeMe1' \
#     docker compose up -d --build
#
# init 服务在建表后预置首个管理员（幂等）；backend 待 init 成功后再启动。

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: csm
      POSTGRES_PASSWORD: csm
      POSTGRES_DB: csm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csm -d csm"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: .
    command: python scripts/init_db.py
    environment:
      CSM_DATABASE_URL: postgresql+psycopg://csm:csm@db:5432/csm
      CSM_INITIAL_ADMIN_USERNAME: ${CSM_INITIAL_ADMIN_USERNAME:-admin}
      CSM_INITIAL_ADMIN_PASSWORD: ${CSM_INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      CSM_DATABASE_URL: postgresql+psycopg://csm:csm@db:5432/csm
      CSM_SESSION_TTL_SECONDS: ${CSM_SESSION_TTL_SECONDS:-43200}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: