[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csm-backend"
version = "0.1.0"
description = "CSM (Cluster Source Manager) backend — V3 phase 1 engineering foundation."
requires-python = ">=3.12"
# Version lines per docs/features/F001/architecture.md §2.1 (D02 baseline).
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "uvicorn[standard]>=0.34,<0.35",
    # DR-07: argon2id password hashing (PHC recommended, no bcrypt 72-byte limit).
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
# TEST-only dependencies (httpx per architecture §2.1). Kept out of runtime image.
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a real PostgreSQL instance via TEST_DATABASE_URL",
    "smoke: pure logic smoke, never a constraint/extension/migration/concurrency evidence",
]