# CSM V1 生产内网 nginx 配置（F015）。
#
# 职责：前端生产构建产物静态服务 + SPA fallback + /api 反向代理到应用。
# 唯一对外入口为 HTTP 80；不含 TLS / 证书 / 域名 / 公网入口。
# 说明参见 docs/deployment/csm-v1-internal-deployment.md。

server {
    listen 80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # 生产下框架默认文档面不可达（纵深防御；应用层在 prod 下也已关闭）。
    # 必须置于 SPA fallback 之前，否则会命中 index.html 而返回 200。
    location = /docs {
        return 404;
    }
    location = /redoc {
        return 404;
    }
    location = /openapi.json {
        return 404;
    }

    # 产品 API 反向代理：保留路径 / 方法 / Cookie / Host。
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # 前端 SPA 静态资源 + history fallback。
    location / {
        try_files $uri $uri/ /index.html;
    }
}