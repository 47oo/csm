# CSM entry reverse proxy (architecture §1.2).
# /api/ -> backend:8000 ; everything else -> frontend:80 (SPA, same origin, no CORS).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    # Preserve the client's original Host header verbatim, including any
    # non-default port (e.g. "localhost:18080"). The backend CSRF guard
    # (Contract §2.1) compares the browser Origin authority with the request
    # Host, so dropping the port via $host would wrongly reject same-origin
    # writes when NGINX_HTTP_PORT != 80. HTTP/1.0 clients without a Host
    # header fall back to $host (server_name).
    map $http_host $csm_host {
        default $http_host;
        ""      $host;
    }

    server {
        listen 80;
        server_name _;

        # Health endpoint exposed on the entry point for operational probes.
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            # F014 import uploads: Contract §10 signs off a 5 MiB (5,242,880 B) file
            # cap, enforced by the backend as IMPORT_FILE_TOO_LARGE. Nginx's default
            # 1 MiB would reject 1-5 MiB uploads before they reach FastAPI, so raise
            # the body limit with headroom. Long synchronous imports (up to 5000
            # rows) also need extended upstream timeouts beyond the 60s default.
            client_max_body_size 6m;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $csm_host;
            proxy_set_header X-Forwarded-Host $csm_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $csm_host;
            proxy_set_header X-Forwarded-Host $csm_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}