      - "AC-33 列表 / 详情 / 按载体结果均排除已软删 Service；按 id → 404。"
      - "AC-34 PATCH 6 个可选字段可更新；null 清空；缺省不变；再次读取一致。"
      - "AC-35 PATCH schema 封闭：未识别 / 不可变字段（id、name、载体绑定、cluster_id、status、deleted_at、凭据、健康）→ 400；空 body → 400；name 与载体绑定不可变（NQ-01/NQ-02）。"
      - "AC-36 可选字段不参与任何唯一性；更新不触发唯一性冲突。"
      - "AC-37 DELETE → 204 无响应体；行仍物理存在且 deleted_at 非空；不再出现在列表 / 详情 / 按载体结果。"
      - "AC-38 删除不级联：全部载体各字段逐字段不变。"
