# ---------------------------------------------------------------------------
# Planning Status
# ---------------------------------------------------------------------------
planning_status:
  plan_completeness: complete
  status: ACCEPTED
  ready_features: [F007]
  blocked_draft_features:
    BLOCKED: [F008, F010, F011]
    DRAFT: []
  counts:
    READY: 1
    BLOCKED: 3
    DRAFT: 0
    DONE: 10
  status_decision_rules:
    DRAFT: >
      存在未解决的产品问题，且该问题直接影响本 Feature 自身 scope 或 acceptance_criteria
      的定稿（自身数据模型 / 字段 / 唯一性 / 生命周期 / 校验策略等产品语义尚未确认）。
    BLOCKED: >
      本 Feature 的 scope 与 acceptance_criteria 已可定稿，仅被 architecture / database
      decision、未 DONE 的 depends_on 或环境阻塞。
    both: >
      两类原因同时存在时取 DRAFT，并在该 Feature 的 blocking 中同时列出两类原因。
    note: >
      仅被其他 Feature 的产品决策间接影响、不改变本 Feature 交付边界时，仍按 BLOCKED 处理。
      判定依据见本文件顶部注释与 .pi/agents/project-manager.md §8。
  done_rationale:
    F012: >
      首个完成 Feature。base 2c2a753 → head 966d56a → merge 3b8646c（--no-ff 合入 develop）。
      Reviewer verdict = APPROVED WITH FOLLOW-UP（无 BLOCKER / HIGH / 必须修复的 MEDIUM）；
      77 文件 / +6999 行经完整差异 Review。验收：真实 PostgreSQL 16 下后端 38 passed、前端 32 passed 且构建成功、
      ruff 与 alembic check 干净；两处最难回退的语义（大小写敏感唯一性、软删释放唯一性）由**绕过应用层**的
      直接数据库断言固定。F001 / F013 / F014 因此解锁。
    F001: >
      base 7a99745 → head fe36e1a → merge 5a96ad0（--no-ff 合入 develop）。
      Reviewer verdict = APPROVED WITH FOLLOW-UP（无 BLOCKER / HIGH / 必须修复的 MEDIUM）；45 文件经完整差异 Review。
      验收：真实 PostgreSQL 16.2 下后端 77 passed、前端 56 passed、构建成功、ruff 干净、alembic check 无 drift；
      我另用 HTTP 逐条驱动 5 个端点核对契约（含大小写敏感、中文往返、409/400/404 语义、PATCH 释放旧名、
      PATCH 改自身名返回 200、/_foundation/* 全 404）。
      **关键否定性交付**：F001 内 deleted_at 写入路径数 = 0（无删除端点）；/_foundation/* 彻底移除，
      同时消解 F012 Review 的 F-03（fail-open MEDIUM）。R-CLUSTER-004 未在 F001 强行构造任何结构。
    F013: >
