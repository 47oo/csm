      - "AC-44 检查点只做追加：BM 保留活跃 VM/NIC/Container 并追加活跃 Service；VM 保留活跃 Container 并追加活跃 Service；CONTAINER_ACTIVE_CHILD_CHECKS 由 () 变为含活跃 Service；三者均被删除路径真实消费。"
