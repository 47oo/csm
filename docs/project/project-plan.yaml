  - id: DEC-020
    type: product
    status: RESOLVED
    resolution: >
      **RESOLVED（2026-09-18，用户裁定）：「做」**——确认把应用外壳导航由顶部横向按钮改为
      侧边栏，范围限于呈现层（不引入 vue-router、不新增依赖、不改路由 / URL、不改资源页面内容、
      不做响应式 / 主题）。据此 F017 解除 NQ-1 并转 READY，进入 Feature Workflow（M7）。
      用户原话为可行性询问，经协调器明确以「做 / 不做 / 只是问问」三选项请其裁定后得到本结论，
      未由 Project Manager 或协调器自行升级。
    question: >
      用户是否需要把应用外壳导航由顶部横向按钮改为**侧边栏**？用户原话为可行性询问
      （「UI 界面的导航栏是否可以改为侧边栏的样式」），需用户明确确认是否实施。
      若实施，范围是否限于呈现层（布局 + 活跃态）——即不引入 vue-router、不新增依赖、
      不改路由 / URL、不改资源页面内容、不做响应式 / 主题。
    impact_features: [F017]
    note: >
      供用户决策的**已核实事实**（非推测）：
      ① **无任何已确认产品规则规定导航形态**（requirements.md §5「页面导航」仅述资源分类的作用之一；
         docs/architecture/f002-bare-metal-handoff.md:230 与 frontend/src/App.vue:23/31/93 均明确
         「导航形式不构成产品规则」），故改为侧边栏不违反任何已确认规则、不新增产品规则。
      ② 「不引入 vue-router」是既往反复采纳的架构立场（f013/f005/f006 handoff 与 App.vue 注释），
         但属 **OPEN 非阻塞项**，且**侧边栏并不需要 vue-router**——它只是把同一套视图状态切换器
         的呈现从顶栏改为侧栏。因此本项**不触发** vue-router 决策，二者相互独立。
      ③ Element Plus 已是既有依赖（element-plus ^2.14.5），其 el-menu / el-aside 当前**未被使用**，
         故侧边栏**不需要新增任何依赖**，与 AGENTS.md §2.6「没有明确收益时，不引入额外框架」不冲突。
      ④ 影响面为纯呈现层，但**共享外壳 frontend/src/App.vue 被改动**；5 个既有导航测试共 **15 处**
         把活跃态断言为 `el-button--primary`，改版后必须**改写而非删除**（已写入 AC-06 作为必需工作）。
      ⑤ 无权限 / 删除 / 全局标识影响；**不存在真正阻塞的长期架构决策**。
      本项属**产品 / UX 取舍**，由用户决定；Project Manager 与协调器均不自行裁定（AGENTS.md §2.8）。

  - id: DEC-021
    type: product
    status: RESOLVED
    resolution: >
      **RESOLVED（2026-09-18，用户裁定）：做。** 用户不仅确认新增该能力，且逐一裁定了 NQ-1 ~ NQ-5 的
      实现语义（见 features[F018].open_questions 各条的 resolved_to）——这构成对该能力与「因此修订既有契约
