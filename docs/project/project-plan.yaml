      + `ck_ip_address_ranges_vlan_range CHECK (vlan IS NULL OR vlan BETWEEN 1 AND 4094)`，无回填）。
      **关键遵守**：`name` 同 Cluster 活跃唯一由 partial unique 为最终权威（应用层预检 + 23505→409 DUPLICATE，永不 500）；
      大小写敏感无 `COLLATE`/`lower()`；掩码纯函数复用 `parse_ipv4`（不复制第二份解析）；仅新增这一条唯一性；
