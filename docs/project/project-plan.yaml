# --- Milestones：按产品可交付能力组织 ---
# Milestone 顺序保证：任一 Milestone 的 Feature 只依赖本 Milestone 或更早 Milestone 的 Feature；
# 退出标准只引用本 Milestone 内闭环（closure_owner）的场景，不在依赖未完成时承诺验收。
milestones:
  - id: M1
    title: 集群、计算资源登记与网络台账
    goal: >
      打通集群登记与身份保护、网段与保留地址、IPv4 分配，
      以及计算资源一次原子录入（公共信息 + 无 IP 网卡 + 全部 IP）与统一列表/详情，可替代核心 Excel 台账。
    features: [F001, F005, F002, F006, F003]
    depends_within: >
      F001 → F005 → F002 → F006 → F003（同一 Milestone 内的实施与验收顺序）。
    exit_criteria: >
      requirements-v2.md §10 场景 3、4、8–12、19–21、24–32、34、43–48、50、52、53 由 M1 内 Feature 闭环通过；
      场景 2（同名裸金属/名称唯一）、5（网卡/IP 归属）、6（唯一性与网卡/IP 可见）、
      42（网络内容/公共信息不变）、51（计算资源与有效网段关联）的 M1 部分通过；
      场景 2 的 VM 同名由 F004（M2）闭环，5/6/42 的服务与 VM 关联部分由 F004/F007（M2/M3）闭环；
      一次提交（含 IP）原子性、资源/接口/名称唯一、IPv4 并发唯一、跨重叠排除、耗尽与释放规则验证通过；
      M1 退出时同一表单支持一次录入公共信息 + 全部网卡 + 全部 IP。
    note: >
      F002 交付表单与整单原子基础（含无 IP 网卡与网段选择），F006 在同一表单集成 IP 分配、
      管理 IP 与含 IP 的整单原子；F002 DONE 时仅验收公共信息、类型字段容器（不含 VM 必填宿主）
      与无 IP 网卡，不承诺 IP 与 VM 注册。
      详情“服务”列与服务关联保护由 M3 的 F007 承接，类型摘要与类型详情由 M2 的 F004 承接，
      均属交付分段而非产品限制。
