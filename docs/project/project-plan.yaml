  - id: F002
    title: 计算资源登记、无 IP 网卡与一次原子提交基础
    epic: E2
    type: FEATURE
    goal: >
      以一次提交登记/编辑计算资源公共信息与网卡（不分配 IP），
      保证整单原子、资源与接口身份唯一及真实删除/自身子项先删基础，
      并交付本对象服务端三角色鉴权、操作审计与资源历史写入，作为 IP 分配与类型详情的前置。
    scope: >
      新增/编辑表单骨架；公共信息（所属集群、资源名称、资源类型、状态）；根据资源类型切换字段容器；
