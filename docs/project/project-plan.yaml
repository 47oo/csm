# CSM 项目计划 — Machine-readable Source of Truth
#
# 本文件是 CSM 项目状态与范围的权威来源。
# 人类可读视图见：
#   - docs/project/backlog.md
#   - docs/project/dependency-map.md
#   - docs/project/milestones.md
#
# 规则：状态初始为 DRAFT，须经用户确认；Project Manager 不得自行改为 ACCEPTED。
# 本计划不包含任何应用代码、数据库或 API 设计。
#
# Feature 状态判定规则（.pi/agents/project-manager.md §8 的落地细化，权威定义）：
#   - DRAFT  ：存在未解决的产品问题，且该问题直接影响本 Feature 自身 scope 或
#              acceptance_criteria 的定稿（自身数据模型 / 字段 / 唯一性 / 生命周期 /
#              校验策略等产品语义尚未确认）。
#   - BLOCKED：本 Feature 的 scope 与 acceptance_criteria 已可定稿，仅被 architecture /
#              database decision、未 DONE 的 depends_on 或环境阻塞。
#   - 两类原因同时存在时取 DRAFT，并在 blocking 中同时列出两类原因。
#   - 仅被其他 Feature 的产品决策间接影响、不改变本 Feature 交付边界时，仍按 BLOCKED 处理。
# 该规则同样适用于 planning_status.status_decision_rules，便于状态复核。

project:
  name: CSM
  goal: >
    建立面向 HPC / AI 运维场景的内部资源管理平台，替代分散维护的 Excel 表格，
    提供统一、清晰、可查询、可维护的资源事实库（资源登记、查询、关系维护、
    状态维护、网络地址管理、虚拟资源管理、服务资源管理、批量数据导入）。
    CSM V1 不是完整 CMDB。
  status: DRAFT
  last_updated: "2026-09-15"
  architecture:
    foundation: docs/architecture/csm-v1-foundation-architecture.md   # READY FOR IMPLEMENTATION
    adrs: docs/architecture/adr/                                      # ADR-0001 ~ ADR-0005 全部 ACCEPTED
    api_contract: docs/api/api-conventions.md                         # READY
  database:
    schema_design: docs/database/csm-v1-schema-design.md              # READY FOR DATABASE IMPLEMENTATION
    f012_baseline_migration: docs/database/f012-baseline-migration.md # F012 基线 migration 规格
  planning_source:
    primary: docs/product/requirements.md        # CONFIRMED BASELINE
    secondary:
      - docs/product/domain-model.md             # 已于 2026-09-15 与 requirements.md 同步（DataCenter / Rack 已移除，状态模型收敛）
    reference:
      - .pi/skills/resource-domain/SKILL.md
      - AGENTS.md
      - docs/project/_planning-findings.md       # Stage 1/2 盘点与 C-1 ~ C-8
  notes: >
    Greenfield 项目：无 backend/、frontend/、tests/、docs/database/、无应用代码、
    无 Feature 级 Handoff、无 Test/Review 报告、无历史项目实现。
    架构已批准：docs/architecture/csm-v1-foundation-architecture.md = READY FOR IMPLEMENTATION，
    ADR-0001 ~ ADR-0005 全部 ACCEPTED，docs/api/api-conventions.md = READY。
    DEC-008 ~ DEC-016 全部 RESOLVED；产品 OPEN-005 已关闭（All-or-Nothing）。
    无 develop 分支，仅有 main。

scope:
  included:
    - Cluster 资源登记与管理（含全局唯一名称）
    - BareMetal 资源登记与管理（含集群内唯一 hostname 与运行状态）
    - NetworkInterface 登记与管理（technology_type / purpose）
    - IPAddress 登记与管理（同 Cluster 内唯一）
    - VirtualMachine 人工登记与查询（不接入虚拟化平台 API）
    - Container 资源模型与登记（不接入 Kubernetes / Docker API）
    - Service 资源管理与 Cluster 共享关联（N:N）
    - 资源查询与关系视图（Cluster 视角、跨资源关联、Not Found 与 Empty Relationship 区分）
    - Excel 模板与批量导入（与人工录入一致的业务校验）
    - 资源逻辑删除与数据一致性治理
    - 系统本地账号认证
    - 内网独立虚拟机部署
    - 项目基础框架与运行环境（含显式资源类型建模，禁止 EAV / 通用 resources 表）

  excluded:
    - 完整 CMDB
    - DataCenter / 数据中心层级（C-1：以 requirements.md §6 为准，V1 不含）
    - 自动资产发现
    - VMware / PVE / OpenStack 自动同步
    - Kubernetes 自动同步
    - Slurm 集成
    - 自动拓扑发现
    - Prometheus 监控平台替代
    - 告警平台
    - 工单系统
    - 采购系统
    - 财务系统
    - 自动容量预测
    - 复杂 RBAC
    - 微服务化
    - 通用 Resource EAV 模型 / 通用 resources 表 / STI / JSONB 万能模型
    - LDAP / AD / OAuth / 企业 SSO
    - 公网入口、域名、HTTPS（V1 使用 Internal IP + HTTP）
    - Undelete / Restore 功能
    - Rack / U 位 / 机柜位置管理（已从 V1 删除，2026-09-15 用户决策）
    - 虚拟资源运行时自动集成（OPEN-006 已关闭为「已确认排除」）

