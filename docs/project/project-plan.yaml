  - id: F013
    title: 用户与角色管理
    epic: E8
    type: FEATURE
    goal: >
      交付平台自建用户与角色管理及平台角色/操作者解析与会话基础：用户增删改、单一角色分配、
      登录/登出、改密/重置、账号禁用；仅平台管理员维护、服务端校验；删除用户保留审计且用户名不复用；
      禁用≠删除；作为全部受管对象服务端鉴权与操作审计的身份前提。
    scope: >
      用户增删改（用户名 + 初始口令 + 单一角色）；用户名在仍存用户中唯一（大小写/首尾空格比较口径按 D-NAME-COMPARISON）。
      单一角色（运维查看者/资源维护者/平台管理员）；角色分配后新操作按新角色鉴权、旧角色不再生效；集群选择不是授权边界。
      登录/登出：已启用账号 + 正确口令登录并建立会话；禁用/未知账号或错误口令不建立会话、不创建/修改业务数据；
      登出后原会话失效，再访问受保护资源须重新登录。
      账号禁用：禁止登录但保留用户记录，可重新启用；与删除不同。
      删除用户：移除账号、不能登录；其历史操作与审计保留；用户名不复用。
      口令策略：最短 8 位且同时含字母与数字；P0 不强制定期过期；用户可自助改密，平台管理员可重置；无自助找回。
      维护权限：用户增删改、角色分配、改密/重置、禁用/启用仅平台管理员可执行，关键权限由服务端校验；
      查看者与维护者越权请求被拒绝且数据不变。
      审计：用户与角色管理操作按 §9.1 记录操作者、时间与关键变更；不并入仅管理员可查的受管资源历史。
      首个管理员由部署/初始化预置，首登须修改初始口令。
      交付平台角色/操作者解析与会话基础，供 F001/F002/F005/F006/F007/F012 复用（受管资源业务授权仍由各对象 Feature 实施）。
