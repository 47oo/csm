      已冻结 API 契约中「不存在关键字查询参数、前端与调用方不得构造」的立场（及 F002 契约的「筛选」排除项）？
    decision_basis:
      - "docs/api/f005-ip-address.md:129 — 「**不存在** `cluster_id` / `vrf` / `status` / IP 前缀 / 排序 / **关键字**等第二维度查询参数；本契约不定义此类参数，前端与调用方**不得构造**（Cluster 视角归 F009；未确认筛选不实现）。」"
      - "docs/api/f009-cluster-resource-view.md:181 — 「分页之外的排序 / **关键字** / 状态筛选 / 导出（无已确认需求）。」"
