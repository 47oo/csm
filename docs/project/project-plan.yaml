    **本无指定范围的能力**。据此登记为对 **R-IP-006 / R-IP-009** 的修订诉求。
    用户 2026-09-22 已就 DEC-025 裁定：① 自动分配**必须显式指定**一个活跃范围段（必填 `ip_address_range_id`）；
