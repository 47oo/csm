      - 从 Cluster 视角可见其下活跃 BareMetal 清单及状态（R-QUERY-001, R-QUERY-002, R-CLUSTER-004）。
      - 每条记录可观察到 hostname 与 status，status 属于 IDLE/ALLOC/DOWN/UNKNOWN 且非空（R-BM-003/005）。
      - 只含本 Cluster 的 BareMetal，不含其他 Cluster（R-BM-001）。
      - 状态修改后重新查询可见最新值（R-BM-006）。
      - 中文 Cluster 名 / hostname 字面往返正确（§21）。
      - R-QUERY-004：Cluster 不存在 → 404 NOT_FOUND，不得返回 200 空清单；界面不得渲染为「暂无机器」。
      - R-QUERY-004：已软删 Cluster 与不存在同样 → 404，不区分。
      - R-QUERY-004：Cluster 存在但无活跃 BareMetal → 200 + 空集合，界面渲染 Empty 态。
      - Empty 态与 Not Found 态、Error 态在界面上互不相同且可独立断言。
      - Empty 不呈现错误提示、不触发全局会话失效。
      - 已软删 BareMetal（绕过应用层预置）不出现在视图中（R-DELETE-002；ADR-0004）。
      - 软删某 BareMetal 后重新查询不再出现，其余不受影响。
      - 无 restore / undelete / include_deleted / 回收站入口或参数（R-DELETE-003）。
      - 不得出现 NIC / IP / VM / Container / Service 的列表、计数、占位或关系入口（R-QUERY-003 归属 F010）。
      - 不得新增 Cluster 状态字段、DataCenter / 位置字段、自动发现 / 实时状态源字段。
      - 未认证访问 Cluster 视角相关端点 → 401 UNAUTHENTICATED 且不返回资源数据（ADR-0005）。
      - AC-17 alias：GET /api/clusters/by-name/{cluster_name}/bare-metals 返回与 GET /api/bare-metals?cluster_id={id} 同一结果集（同字段 / 同排序 / 同分页信封）；名称不存在或 Cluster 已删 → 404 NOT_FOUND；无活跃成员 → 200 + items==[]；大小写敏感；未认证 → 401（ADR-0003 §2）。
      - AC-18 边界封闭：F009 端点集合恰为上述 1 条；无 NIC/IP/VM/Container/Service 的路径、字段或占位；软删过滤仍恰有 1 条写入路径与统一读取原语（G-009-1 ~ G-009-6）。
