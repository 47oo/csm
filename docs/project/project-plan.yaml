  - id: DEC-019
    type: product
    status: RESOLVED
    topic: 登录失败响应语义
    resolution: 用户 2026-09-15 裁定：登录失败统一响应，不区分「用户名不存在」与「口令错误」（R-AUTH-006）。
  - id: DEC-016
    question: >
