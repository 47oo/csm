      验收：真实 PostgreSQL 16.2 下后端 133 passed、前端 83 passed 且构建成功、ruff 干净、alembic check 无 drift。
      **关键否定性交付**：路由前 ASGI 中间件 fail-closed，豁免集合恰为一个 (method, path) 对，新挂载 /api 端点自动受保护；
      登录失败三情形逐字节一致；口令不明文落库 / 日志 / 错误；绕应用层验证 username 大小写敏感；
      Migration 0002 增量，基线 0001 未改。Tester / Reviewer 均以真实库独立重跑。
    F014: >
      base 897b325 → head d2805f5 → merge 184ee61（--no-ff 合入 develop）。
      Reviewer verdict = APPROVED WITH FOLLOW-UP（无 BLOCKER / HIGH / 必须修复的 MEDIUM）；28 文件 / +2899 行经完整差异 Review。
      验收：真实 PostgreSQL 16.2 下后端 155 passed、前端 105 passed 且构建成功、ruff 干净、alembic check 无漂移、无新增 migration。
      **关键交付**：`soft_delete()` 是系统内唯一写 `deleted_at` 的路径（allow-list guard 真实可失败）；
      单事务先 `FOR UPDATE` 锁父行再跑资源声明的 active_children 检查，命中即 409 且无部分写入；
