  - id: DEC-022
    type: product
    status: RESOLVED
    resolved_on: "2026-09-20"
    resolved_by: user
    topic: 搜索结果聚合语义与 R-QUERY-005 「单一混合列表 / 不提供聚合」条款的取舍
    question: >
      是否把 F018 的搜索结果从「逐条独立、扁平混合列表」改为「按关联资源组聚合呈现」
      （如输入 IP 片段时，把其裸金属 cn001、该 IP、其所在网卡 eth0 作为一个相关联的资源组一起展示）？
      若改为聚合：(a) 分组单位是什么；(b) 是否做关系扩展（纳入自身字段不匹配的相关资源）；
      (c) 聚合信封 / 呈现形态；(d) 未关联到任何 BareMetal 的命中资源如何处置；(e) 跨组重复如何去重；
      (f) 排序与分页语义；(g) 是否保留或取代 F018 的扁平列表。
      上述取舍直接冲突于已确认的 **R-QUERY-005**（明文「结果为单一混合列表，不按资源类型分组」，
      且「除结果总数外不提供统计（按类型计数、聚合、仪表盘）」），须由用户 / Product 裁定。
    impact_features: [F019, F018]
    note: >
      本项为**产品 / 契约立场取舍**，Project Manager 与协调器均**不得自行裁定**（AGENTS.md §2.8）。
      完整歧义清单见 `features[F019].open_questions`（NQ-1 ~ NQ-8 均为 blocking）。
      裁定结果可能要求：修订 requirements.md §16 的 R-QUERY-005 或新增聚合规则、修订 / 新增搜索响应契约
      （F018 契约 `docs/api/f018-cluster-keyword-search.md`）、并调整 F019 的 layers（database 可能由 false 变 true）。
      **在裁定前，F019 保持 DRAFT 且不得实现；F018 已 DONE 的既有实现与结论不被本项推翻。**
    resolution: >
      **RESOLVED（2026-09-20，用户裁定）**：用户就本项的 8 个问题逐一给出决定，并回答了三处澄清：
      ① （结果形态）**扁平混合列表**——仍是一张单一列表，不按资源类型分区；
      ② （聚合 / 分组单位）**按命中项关联链**——以每个命中项为单位展开其关联链（顶层仍是扁平列表，
      组织顺序以「命中项 + 其关联链」为单元）；
      ③ （关系扩展）**是**——命中项的关联链资源也纳入结果，即使其自身字段未命中关键字；
      ④ （呈现 / 信封）**方案 A**——「命中行 + 缩进关联行」：每行是一个资源，命中行标「命中」、
      关联行标「关联」及其推导路径；
      ⑤ （未关联命中资源）**仅显示查到的资源**，采纳解读 **(a)**：即「查到的资源」= 命中项 **+**
      其关联链资源（与 ③ 的扩展一致），不做全量倾销；
      ⑥ （去重）**不去重**——同一资源因命中多条链时**重复出现**；
      ⑦ （排序）按**关键字最靠近**，具体采纳 **(a) 字段优先级**：**标识字段（hostname / name /
      ip_address）优先于描述性字段**；
      ⑧ （是否取代）**取代** F018 的扁平列表行为。
      澄清结论：① 的解读成立（顶层扁平、按命中链组织）；② 选 (a)；其余按上述。
      **未由用户指定**：同优先级各结果之间的**兜底顺序**（确定性 tie-break）——属可实现性选择，
      由 Architecture 在契约中定稿，不得扩张为新的产品规则。
      本裁定与已确认 **R-QUERY-005** 的「单一混合列表，不按资源类型分组」「不提供聚合 / 排序」条款冲突，
      因此**必须由 Product 修订 R-QUERY-005 或新增聚合规则**（NQ-8）方可使 F019 挂 requirement ID；
      并可能要求修订 / 新增搜索响应契约。裁定后 F019 由 DRAFT 转 READY，进入 Feature Workflow。

