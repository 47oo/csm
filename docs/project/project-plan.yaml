      - "docs/api/f002-bare-metal.md:454 — 「硬件字段的结构化拆分、统计 / 报表 / **筛选**（R-BM-007）。」（排除项）"
    impact_features: [F018, F002, F005, F009, F010]
    note: >
      **DEC-020 已 RESOLVED，本项不得改动它。** 本项为**产品 / 契约立场取舍**，由用户裁定；
      Project Manager 与协调器均不自行裁定。若裁定为「不做」，则 F018 撤销（CANCELLED），
