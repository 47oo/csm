- id: F003
  title: Cluster 管理与持久化横切首落地
  kind: FEATURE
  priority: P0
  milestone: M2 集群与裸金属闭环
  scope: Cluster 实体（name、code、status、description、metadata 及审计字段）；code 全局唯一、大小写不敏感、创建后不可改、软删除后不重用（全量唯一索引）；name
    可改、允许中文、不强制唯一；status ACTIVE/INACTIVE 人工维护、不级联其他对象状态、不释放 IP；INACTIVE 仍按既有权限维护，默认查询含停用且支持状态过滤。持久化横切随首个业务对象落地：deleted_at
    软删列与默认过滤、ADMIN 查看已删除对象与恢复（首个对象）、Audit 表与写路径（operator/action/object_type/object_id/before_data/after_data/created_at，与业务写入同事务）、端到端乐观锁（过期版本拒绝、无静默覆盖）、名称归一化、稳定
    ID；D01 共享约定基座（名称归一化与字符长度、稳定 ID、必填、时间存储/接口/展示时区、MiB/GiB 单位与数值上限、nullable、省略语义）在本
    Feature CONTRACT 签核；D02 审计一致性部分签核。Cluster 列表（组合过滤/排序/分页，向统一契约收敛）、Cluster Detail（§19）与
    Cluster 维度基础搜索入口；本域字段契约补齐 D01，归一化键列与唯一约束首次建表落地。
  acceptance: code 规则与 T13 通过；停用集群维护、默认查询含停用与状态过滤通过（T29）；软删默认隐藏且 ADMIN 可恢复、恢复重检冲突（T24
    首个对象）；关键修改写入 Audit 且与业务同事务（T26 部分）；过期版本编辑被 409 拒绝（T26）；名称归一化与稳定 ID 固化为共享契约（T40
    部分）；D01 基座与 D02 审计一致性在本 Feature CONTRACT 签核。
