      - "AC-23 唯一性边界对照：Service 全局唯一与 Container 载体内唯一严格分离，互不削弱、不得混用。"
      - "AC-24 不与其它资源类型名称冲突：同名 Cluster/BareMetal/VM/Container 存在时登记同名 Service → 201；各资源唯一性各自独立。"
