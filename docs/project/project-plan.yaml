project:
  name: CSM
  version: v2
  goal: >
    为 HPC / AI 运维场景提供统一的集群资源登记、查询、维护、关联与状态查看平台，
    逐步替代分散的 Excel 台账；V2 独立定义需求、领域模型、架构与实现。
  status: DRAFT
  status_changed_on: "2026-09-24"
  approved_by: null
  approved_on: null
  planning_source:
    primary: docs/product/requirements-v2.md
    domain: docs/product/domain-model.md
    rules:
      - docs/project/project-state.md
      - docs/project/git-workflow.md
      - docs/project/handoff.md
    workflow: .pi/prompts/project.md
  notes: >
    首次规划。V2 现有交付证据为空：v2 分支仅脚手架，无已登记 Feature、
    无架构/API/数据库文档、无实现代码。所有 Feature 均为 P0，覆盖
    requirements-v2.md §10 全部 41 条验收场景。技术栈、数据库、部署与 API
    规范尚未批准，进入实现前必须由用户裁定（见 decisions_required）。

scope:
  included:
    - 集群登记、选择与作为资源归属（含集群聚合计数与搜索作用域展示，BQ-D）
    - 计算资源统一身份与登记：统一资源列表/详情、类型切换、筛选分页、按名称/IP 搜索
    - 计算资源一次原子提交：公共信息 + 类型详情 + 全部网卡 + 全部 IP
    - 计算资源类型详情：裸金属 SN/CPU/内存/GPU 等；VM 宿主/vCPU/内存；宿主反查 VM
    - 网段管理：CIDR、用途、技术类型、VLAN、网关、自动分配范围、保留地址、逻辑删除
    - IPv4 手动与自动分配、释放与重用、并发唯一、耗尽处理
    - 服务与部署实例：跨集群关联、访问入口（按服务 × 集群）、节点角色、双向查询
    - 统一模糊搜索与下拉交互规范（所有搜索框/单选/多选/枚举）
    - 角色权限与操作审计（查看者 / 维护者 / 管理员，审计不随逻辑删除消失）
    - 非功能与可用性基线：服务端分页、时区、状态文字、键盘、横向滚动、并发保护、无半条数据
  excluded:
    - 自动发现
    - 故障告警
    - Excel/CSV 导入
    - Excel/CSV 导出
    - 批量更新
    - 完整 CMDB 生命周期
    - DHCP
    - 自动修改服务器网络配置
    - VM 自动创建、迁移、启停
    - 服务自动部署与健康检查
  excluded_note: >
    以上为 P0 范围外（requirements-v2.md §3.2），不构成永久排除。
    requirements-v2.md 未确认任何非 P0 范围，故本计划不登记 P1/P2 Feature，
    避免在无已确认需求支撑下预建框架。

# --- Epics：产品能力域 ---
epics:
  - id: E1
    title: 集群与全局导航
    goal: 集群主数据登记、选择与作为资源归属；集群入口聚合概览与搜索作用域。
    features: [F001, F010]
  - id: E2
    title: 计算资源统一身份与登记
    goal: 裸金属与 VM 共用资源身份，统一列表/详情、一次原子录入、逻辑删除与恢复。
    features: [F002, F003]
  - id: E3
    title: 类型详情与宿主关系
    goal: 按资源类型维护专有详情；VM 关联同集群有效裸金属宿主并支持双向查询。
    features: [F004]
  - id: E4
    title: 网段与 IPv4 分配
    goal: 集群多网段维护与 IPv4 手动/自动分配、保留地址与唯一性保障。
    features: [F005, F006]
  - id: E5
    title: 服务与部署实例
    goal: 服务跨集群关联、访问入口按服务×集群配置、部署实例与节点角色。
    features: [F007]
  - id: E6
    title: 通用检索与下拉
    goal: 所有搜索框与下拉支持可输入模糊匹配，服务端模糊查询与稳定排序。
    features: [F008]
  - id: E7
    title: 权限、审计与非功能基线
    goal: 三角色服务端鉴权、操作审计、性能/可靠性与可用性基线。
    features: [F009, F011]

