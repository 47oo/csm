      - AC-01 登记成功：POST /api/clusters 合法名称 → 201，含 id/name/created_at/updated_at，不含 deleted_at、不含状态字段。
      - AC-02 名称必填：缺失或非字符串 → 400 VALIDATION_ERROR + details[].field=="name"，且不产生记录（R-CLUSTER-001, §21）。
