# CSM 项目计划 — Machine-readable Source of Truth
#
# 本文件是 CSM 项目状态与范围的权威来源。
# 人类可读视图见：
#   - docs/project/backlog.md
#   - docs/project/dependency-map.md
#   - docs/project/milestones.md
#
# 规则：状态初始为 DRAFT，须经用户确认；Project Manager 不得自行改为 ACCEPTED。
# 本计划不包含任何应用代码、数据库或 API 设计。
#
# Feature 状态判定规则（.pi/agents/project-manager.md §8 的落地细化，权威定义）：
#   - DRAFT  ：存在未解决的产品问题，且该问题直接影响本 Feature 自身 scope 或
#              acceptance_criteria 的定稿（自身数据模型 / 字段 / 唯一性 / 生命周期 /
#              校验策略等产品语义尚未确认）。
#   - BLOCKED：本 Feature 的 scope 与 acceptance_criteria 已可定稿，仅被 architecture /
#              database decision、未 DONE 的 depends_on 或环境阻塞。
#   - 两类原因同时存在时取 DRAFT，并在 blocking 中同时列出两类原因。
#   - 仅被其他 Feature 的产品决策间接影响、不改变本 Feature 交付边界时，仍按 BLOCKED 处理。
# 该规则同样适用于 planning_status.status_decision_rules，便于状态复核。

project:
  name: CSM
  goal: >
    建立面向 HPC / AI 运维场景的内部资源管理平台，替代分散维护的 Excel 表格，
    提供统一、清晰、可查询、可维护的资源事实库（资源登记、查询、关系维护、
    状态维护、网络地址管理、虚拟资源管理、服务资源管理）。
    CSM V1 不是完整 CMDB。
    （原列入的目标「批量数据导入」已于 2026-09-18 由用户取消，不在 V1 交付范围内；
    requirements.md §18 的 R-IMPORT-001~004 规则文本按原样保留但标注为不交付。）
