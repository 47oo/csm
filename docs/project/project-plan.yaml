    name: 基础资源管理
    description: Cluster / BareMetal 等基础设施资源的登记与唯一性管理。
    features: [F001, F002]
  - id: E02
    name: 网络资源管理
    description: NetworkInterface 与 IPAddress 的登记、唯一性与关联。
    features: [F004, F005]
  - id: E03
    name: 虚拟资源管理
    description: VirtualMachine 与 Container 的资源模型与人工登记。
    features: [F006, F007]
  - id: E04
    name: 服务资源管理
    description: Service 资源及其与 Cluster 的共享关联。
    features: [F008]
  - id: E05
    name: 资源查询与视图
    description: 从 Cluster 视角及资源详情视角查询资源与关系。
    features: [F009, F010]
  - id: E06
    name: 数据导入
    description: Excel 模板与批量资源导入。
    features: [F011]
  - id: E07
    name: 平台基础能力
    description: 项目基础框架、本地认证、逻辑删除与一致性治理、内网部署（ENABLER）。
    features: [F012, F013, F014, F015]

