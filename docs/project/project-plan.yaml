- id: F026
  title: 集群范围授权基座与 ADMIN 授权管理
  kind: FEATURE
  priority: P0
  milestone: M17 集群范围授权基座
  scope: 在既有基础角色之上建立「用户 × Cluster」授权事实，并提供仅 ADMIN 可用的授权管理能力。范围含：新增用户-集群授权持久化结构 （含授权/撤销时间与操作者，撤销保留历史而非物理删除，具体表名
    / 列 / 索引 / 约束由 Database 在 DATABASE Gate 签核）； Alembic 迁移与既有数据回填（按裁定口径为既有非 ADMIN
    × 既有 Cluster 建立授权，是否含软删 Cluster、是否允许为 ADMIN 建授权行按决策结果执行）；授权查询 / 授予 / 撤销 API（Contract
    由 Architect 签核，遵循 §25 与公共 API 约定，越权与错误语义按 裁定统一处理）；System 页面内的授权管理 UI（仅 ADMIN 可见可操作，按既有
    Ant Design + Tailwind 基线，列出用户 / 角色 / 已授权集群 / 授权与撤销状态，支持新增与撤销并呈现结果）；授权授予与撤销写入 Audit（operator
    / action / object_type / object_id / before_data / after_data，与业务写入同事务，不记录敏感内容）；定义统一的访问范围类型（如
    AccessScope）与逐请求解析入口 （ADMIN 解析为不受限，非 ADMIN 解析为授权集群集合），供 F027 复用。明确不做：在 F026 内对既有个各业务域端点施加范围过滤
    （由 F027 承接）；新增角色类型；资源实例级授权；组织 / 租户模型；授权审批流。
  acceptance: 映射 §23.2 与 T85-T90。迁移可在真实 PostgreSQL 上正向执行与回滚，回填结果与裁定口径逐条一致且可核对计数； 授权授予
    / 撤销仅 ADMIN 可用，非 ADMIN 调用被服务端拒绝；撤销即时生效并保留可追溯的撤销时间与操作者，不物理删除历史；授权授予与 撤销各产生一条 Audit
    且与业务写入同事务、失败不留残留；AccessScope 对 ADMIN 为不受限、对非 ADMIN 为显式集群集合，同一请求内 解析结果稳定可复用；System
    页面授权 UI 仅 ADMIN 可达且不泄露给其它角色；针对 ADMIN 立授权行的处理符合裁定；新增集群的默认授权 行为符合裁定。本 Feature 不改动任何既有端点的可见数据范围，既有
    T01-T84 行为无回归。
