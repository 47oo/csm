scope:
  included:
    - 集群主数据登记、选择与作为资源归属；集群 code 全局唯一且创建后不可改，名称/用途可维护
    - 集群删除保护：存在有效计算资源、有效网段或服务关联时禁止删除，不级联
    - 计算资源统一身份与登记：统一资源列表/详情、类型切换、筛选分页、按名称/IP 搜索（当前集群作用域）
    - 计算资源一次原子提交：公共信息 + 类型详情 + 全部网卡 + 全部 IP（公共信息+网卡+IP 由 F002/F006 在 M1 交付，类型详情由 F004 在 M2 扩展）
    - 同名新增显式确认进入既有资源编辑（不创建第二条、不自动覆盖或合并）
    - 管理 IP 从本资源有效网卡 IP 指定、可空，删除时须同次显式清空/重选
    - 资源并发编辑冲突保护：冲突提示、保留输入、不静默覆盖或自动合并
    - 资源逻辑删除与恢复：恢复范围仅含随本次删除的网卡/IP，整次原子
    - 计算资源类型详情：裸金属 SN/CPU/内存/GPU 等；VM 宿主/vCPU/内存；宿主反查 VM
    - 网段管理：CIDR、用途、技术类型、VLAN、网关、自动分配范围、保留地址、逻辑删除
    - 同集群重叠网段仅提示风险并允许保存；保留地址/网关须在所属 CIDR 内且跨重叠网段排除分配
    - 网卡网段可选（0..1），分配 IP 前必须选定
    - IPv4 手动与自动分配、释放与重用、并发唯一、耗尽处理
    - 服务与部署实例：跨集群关联、允许零部署、访问入口按服务 × 集群 0..N、节点角色、双向查询
    - 服务删除与解除关联保护：存在部署实例时拒绝，不级联删除实例
    - VIP 与节点网卡 IP 分开记录，登记 VIP/监听地址不产生 IP 分配记录
    - 统一模糊搜索与下拉交互规范（所有搜索框/单选/多选/枚举）
    - 独立全局 IP 查询入口（跨集群结果，与当前集群资源页区分）与集群入口聚合计数
    - 全平台统一三角色权限作用域（查看者 / 维护者 / 管理员；集群选择非授权边界）与操作审计
    - 非功能与可用性基线：服务端分页、时区、状态文字、键盘、横向滚动、并发保护、无半条数据
  excluded:
    - 自动发现
    - 故障告警
    - Excel/CSV 导入
    - Excel/CSV 导出
    - 批量更新
    - 完整 CMDB 生命周期
    - DHCP
    - 自动修改服务器网络配置
    - VM 自动创建、迁移、启停
    - 服务自动部署与健康检查
  excluded_note: >
    以上为 P0 范围外（requirements-v2.md §3.2），不构成永久排除。
    requirements-v2.md 未确认任何非 P0 范围，故本计划不登记 P1/P2 Feature，
    避免在无已确认需求支撑下预建框架。

# --- Epics：产品能力域 ---
epics:
  - id: E1
    title: 集群与全局导航
    goal: 集群主数据登记、身份与删除保护、选择与作为资源归属；集群入口聚合概览、当前集群搜索作用域与独立全局 IP 查询。
    features: [F001, F010]
  - id: E2
    title: 计算资源统一身份与登记
    goal: 裸金属与 VM 共用资源身份，统一列表/详情、无 IP 网卡基础与一次提交、同名确认、并发保护与逻辑删除恢复；IP 分配由 E4 在同一表单集成。
    features: [F002, F003]
  - id: E3
    title: 类型详情与宿主关系
    goal: 在 F002/F003 基础上扩展类型专有详情、列表/详情类型摘要；VM 关联同集群有效裸金属宿主并支持双向查询。
    features: [F004]
  - id: E4
    title: 网段与 IPv4 分配
    goal: 集群多网段维护与 IPv4 手动/自动分配、保留地址与唯一性保障；重叠网段提示与跨段排除；IP 在资源表单内集成。
    features: [F005, F006]
  - id: E5
    title: 服务与部署实例
    goal: 服务跨集群关联、零部署与关联下多入口、部署实例与节点角色、删除/解除关联保护。
    features: [F007]
  - id: E6
    title: 通用检索与下拉
    goal: 所有搜索框与下拉支持可输入模糊匹配（基础能力与已交付对象适配），服务端模糊查询与稳定排序；宿主/服务/全局 IP 查询按同一规范适配。
    features: [F008]
  - id: E7
    title: 权限、审计与非功能基线
    goal: 全平台三角色服务端鉴权、操作审计、性能/可靠性与可用性基线。
    features: [F009, F011]

# --- Features ---
# 每项：id、title、epic、type、goal、scope、out_of_scope、acceptance、
#       acceptance_scenarios（本 Feature DONE 时主要验收归属/可独立核验部分）、
#       acceptance_note（联验说明）、priority、depends_on、blocking_decisions、
#       status、layers、implementation、contract、git、evidence
#
# 验收原则：Feature DONE 必须具备当时依赖已完成、可独立核验的用户可见价值。
# 场景的闭环归属见 requirement_coverage.scenarios.*.closure_owner。
features:
  - id: F001
    title: 集群登记、身份与删除保护
    epic: E1
    type: FEATURE
    goal: 提供集群主数据登记、列表与选择，保证集群身份稳定，并定义集群删除保护规则，作为所有资源的归属前提。
    scope: >
      集群编号 code、名称、用途的登记与查询；code 全局唯一且创建后不可修改，名称、用途可维护（BQ-H）；
      集群列表；集群选择并记住本次选择；集群作为计算资源、网段、服务的归属；
      定义集群删除保护规则：存在有效计算资源、有效网段或服务关联时禁止删除，需先显式处理关联，
      不级联删除这些对象（BQ-H）；无上述有效关联时允许删除。
      各关联类型的联动拒绝在 F002/F005/F007 引入关联后分别验收，规则本身不在 F001 DONE 时宣称全部通过。
    out_of_scope: 集群聚合计数与独立全局 IP 查询（F010）；角色权限（F009）；各关联对象实现（F002/F005/F007）。
    acceptance:
      - requirements-v2.md §4.1.1、§4.1.6–4.1.9
      - requirements-v2.md §6.1（集群编号/名称/用途与选择记忆）
      - requirements-v2.md §10 场景 50（集群 code 与名称/用途部分）
      - requirements-v2.md §10 场景 51（删除保护规则与无关联集群可删除部分）
    acceptance_scenarios:
      - "50（集群 code 全局唯一、创建后不可修改；名称/用途可维护部分）"
      - "51（删除保护规则定义；无有效关联时允许删除部分）"
    acceptance_note: >
      场景 50 中“已登记资源的所属集群不可通过普通编辑修改”由 F002 验收；
      场景 51 的完整闭环需 F002（有效计算资源）、F005（有效网段）、F007（服务关联）分别引入关联，
      由 F007 在 M3 完成三类关联齐全的最终闭环。F001 不承诺有关联集群的删除保护验收。
    priority: P0
    depends_on: []
    blocking_decisions: [D-NAME-COMPARISON]
    status: BLOCKED
    layers: {database: true, backend: true, frontend: true}
    implementation: {database_design: PENDING, backend: PENDING, frontend: PENDING, test: PENDING, review: PENDING}
    contract: {status: BLOCKED, doc: null, reason: API 规范未批准}
    git: null
    evidence: []

  - id: F002
    title: 计算资源登记、无 IP 网卡与一次原子提交基础
    epic: E2
    type: FEATURE
    goal: >
      以一次提交登记/编辑计算资源公共信息与网卡（不分配 IP），
      保证整单原子、资源与接口身份唯一及逻辑删除/恢复基础，作为 IP 分配与类型详情的前置。
    scope: >
      新增/编辑表单骨架；公共信息（所属集群、资源名称、资源类型、状态）；根据资源类型切换字段容器；
      网卡卡片：接口名 + 可关联 0..1 个本集群有效网段（§4.6.9/4.6.10），本阶段不分配 IP；
      一次保存公共信息与全部网卡，整单原子（§4.5）；编辑时区分“删除网卡”与“未修改”；
      已登记资源通过同一表单补充网络内容（可新增网卡或复用既有接口名，公共信息可不变更，
      仍一次提交、整单原子，BQ-G/BQ-H）；
      新增时发现同集群同名有效资源，提示并由用户确认是否进入该资源编辑，不创建第二条、
      不自动覆盖或合并（BQ-H）；同集群有效资源名称统一唯一，同一资源下接口名唯一；
      resource_type 与所属集群创建后只读；
      逻辑删除基础：删除资源不级联删除 VM/服务实例（关联存在时拒绝，由 F004/F007 引入关联后验收）；
      恢复仅含随本次资源删除的网卡，整次原子；改名不改归属；
      两人基于同一旧版本编辑同一资源时，后提交者收到冲突提示并保留输入，不静默覆盖（BQ-H）。
      阶段边界：本 Feature 交付“按资源类型切换的类型字段容器”与公共信息/网卡，
      不含类型专有字段与 VM 必填宿主约束；VM 的有效注册（宿主必填、vCPU/内存等）由 F004（M2）验收，
      F002 不宣称 VM 注册通过。资源详情的“服务”关联与服务实例关联保护由 F007（M3）验收。
    out_of_scope: >
      IP 分配、管理 IP、含 IP 的原子性与并发唯一（F006）；类型专有字段、列表/详情类型摘要与宿主关系（F004）；
      列表与详情展示（F003）；网段维护（F005）；
      VM 有效注册（宿主必填等）与类型专有详情（F004）；详情“服务”列与服务实例关联保护（F007）。
    acceptance:
      - requirements-v2.md §2.2（已登记资源补充/新增网卡路径，BQ-G/BQ-H）
      - requirements-v2.md §4.1.2–4.1.5、§4.1.8、§4.1.10
      - requirements-v2.md §4.2.4、§4.2.5
      - requirements-v2.md §4.4（资源级删除与恢复的网卡部分）
      - requirements-v2.md §4.5（公共信息与网卡的整单原子）
      - requirements-v2.md §6.4（表单结构、网卡卡片与网段选择）
      - requirements-v2.md §7.2、§7.3、§7.4（公共/网卡部分）
      - requirements-v2.md §10 场景 2, 5, 6, 28, 29, 34, 45, 47
      - requirements-v2.md §10 场景 30（网卡可仅选网段或暂不选网段，最多一个网段部分）
      - requirements-v2.md §10 场景 50（资源所属集群不可修改部分）
      - requirements-v2.md §10 场景 51（存在有效计算资源时禁止删除集群部分）
    acceptance_scenarios:
      - "2（同名裸金属/名称唯一部分）"
      - "28"
      - "29"
      - "30（无 IP 网卡可仅选网段或暂不选网段，最多一个网段部分）"
