      Reviewer verdict = APPROVED WITH FOLLOW-UP（无 BLOCKER / HIGH / 必须修复的 MEDIUM）；14 文件 / +1986 行经完整差异 Review。
      验收：真实 PostgreSQL 16.2（大小写敏感 collation）后端 311 passed、前端 176 passed 且构建成功、ruff 干净、migration 与 base 零差异。
