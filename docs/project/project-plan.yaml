- id: F001
  title: 工程与部署底座
  kind: ENABLER
  priority: P0
  milestone: M1 基础与访问控制
  scope: 建立前后端工程骨架与部署基线：FastAPI / Pydantic 后端与 React / TypeScript / Vite 前端脚手架、Nginx
    入口代理、docker compose up -d 启动 Nginx→Frontend/FastAPI→PostgreSQL；SQLAlchemy 2.x
    + Alembic 迁移基线与首个基准迁移；扩展启用策略（pg_trgm、btree_gist 等）在基线迁移明确并经本 Feature DATABASE
    Gate 签核；真实 PostgreSQL 集成测试基线（pytest fixture 可建 schema、执行 Alembic、事务级清理；SQLite
    仅用于纯逻辑冒烟，不作约束证据）；备份机制骨架（pg_dump 流程、恢复文档与冒烟验证，不宣称已覆盖 Audit 数据）；配置与凭据注入机制（真实初始凭据不入仓）；为
    T07/T35 并发验证准备多连接并发与最终持久化状态断言前提。
  acceptance: docker compose up -d 可启动完整链路并访问健康检查；Alembic 基线可在真实 PostgreSQL 建库并回滚；pytest
    集成基线可运行并清理；扩展启用策略在迁移中明确；备份骨架可执行 pg_dump 并按文档恢复；D02 基础部分（软件版本、目录结构、迁移基线、扩展、测试基线）在本
