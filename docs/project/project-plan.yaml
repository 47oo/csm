      - "AC-26 保存前阻止 + DB 最终权威：绕应用层直插第二条同名活跃 Service 被 DB 拒绝。"
      - "AC-27 软删释放唯一性：软删后可重新登记同名 → 201；旧行 deleted_at 未改写。"
      - "AC-28 无状态：请求 / 响应 / 表 / 端点均无 status。"
      - "AC-29 列表分页 200 + 空信封；无活跃 Service 时 items==[]，不得 404。"
      - "AC-30 详情：不存在或已软删 id → 404（不区分）。"
      - "AC-31 按载体限定读取（三种载体类型均成立）：载体活跃但无绑定 → 200 + items==[]；载体不存在 / 已删 → 404；只返回绑定到该载体的活跃 Service（形态见 NQ-09，须供 F010 复用）。"
