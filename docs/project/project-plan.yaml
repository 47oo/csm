      head_commit: 46c6d8a3dd2defd26c32cf283b1b4afe550c00f2
      merge_commit: 4d2e48c7384771f7e949efa9fc5a33ea2ed0e8a5
    current_stage: null
    layers:
      database: true      # 增量 migration 0002_f013_auth（users / sessions）；不改基线
      backend: true       # app/auth/ 模块 + AuthMiddleware（fail-closed）+ CLI + 既有测试调整
      frontend: true      # api/auth.ts + http.ts 全局 401 + LoginPage + App 会话态与登出
