- id: F027
  title: 服务端访问范围强制执行
  kind: FEATURE
  priority: P0
  milestone: M18 服务端范围强制执行
  scope: 将 F026 的 AccessScope 施加到全部服务端读写路径，使非 ADMIN 只能观察与操作其被授权 Cluster 内对象，且未授权 Cluster
    及其对象 完全不可见。范围含：11 个业务域的列表与详情（Cluster、Resource、Interface、Network、IPPool、IPAddress、Service、
    ServiceEndpoint 及 Cluster Detail / Resource Detail 聚合视图）默认按范围收敛；创建 / 修改 / 删除 /
    恢复 / 解绑 / 释放等写路径按范围校验并拒绝越权，且失败不产生业务变更或 Audit 残留；Activity / Audit 的可见性按既有 §22 规则叠加范围口径
    （完整审计查询仍限 ADMIN）；跨对象父级派生（IP → Interface → Resource → Cluster；Endpoint → Service
    → Resource → Cluster；明细跟随 Resource）与未绑定 IP 的 Cluster 归属推导；全局搜索 4 类候选匹配、关联行展开（含
    F018 字段组合）与 total 均按范围收敛，分页与 total 不泄露未授权对象；Dashboard 各计数与 Network / AUTO 池容量口径按范围重算（零授权行为按裁定）；
    F014 / F023 导入的预校验与写入行级归因（未授权 Cluster 行报错含行号 / 字段 / 原因，整批原子性不变）与 F025 采集脚本 --push
    走同一范围口径；错误语义按裁定统一（404 与 403 的选择与不泄露存在性要求）。明确不做：新增角色或权限项；资源实例级授权； 修改既有 §23 权限矩阵中角色可执行的操作类别；修改
    F014 / F023 冻结模板与列集；前端新增授权管理界面（F026 已交付）。
  acceptance: 映射 §23.2 与 T91-T97。非 ADMIN 在全部 11 域列表 / 详情 / 聚合视图中仅能看到已授权 Cluster 内对象，未授权
    Cluster 的对象完全不出现且不通过 total / 计数 / 搜索推断存在性；写路径（创建 / 修改 / 删除 / 恢复 / 解绑 / 释放 / 导入
    / 批量绑定 / 脚本推送）对未授权对象一律拒绝，拒绝后对象状态、关联与 Audit 均无变化；跨对象父级派生与未绑定 IP 归属结果与 裁定口径一致；全局搜索
    4 类候选、关联行与 total 按范围收敛且既有匹配 / 排序 / 去重 / 分页语义不变；Dashboard 计数与 Network / AUTO 池容量按范围重算，零授权时行为符合裁定且不报错；API
    Key 继承绑定账号范围；导入预校验与写入的越权行均可定位 到行号且整批回滚无残留；ADMIN 不受范围限制且既有 T01-T84 行为无回归。本 Feature
    的读写限制必须在同一次合并内整体生效，不得 以「部分端点已受限、其余仍全局可见」的中间态合并。
