      NetworkInterface）还是新的分配 / 预留实体；自动分配的「第一个最小的 IP」是跨全部范围段取全局最小
      还是按范围段顺序取第一个范围内最小，「已占用」如何判定（活跃 IPAddress / 软删释放）；手动分配是否
      必须落在已定义范围段内、范围段外字面 IP 是否仍可按 F005 登记；CIDR 下是否跳过网络 / 广播 / 网关等
      保留地址；范围段耗尽 / 无可用 IP 时的行为与错误语义；范围段能否修改 / 删除、有分配时的删除约束与
      软删语义；是否引入 IP 格式解析 / 归一化；分配是否引入 R-IP-001 之外的新唯一性约束。
    impact_features: [F020, F021, F005]
    note: >
      本项为**产品语义取舍**，Project Manager 与协调器均**不得自行裁定**（AGENTS.md §2.8）。
      完整歧义清单见 `features[F020].open_questions` 与 `features[F021].open_questions`（全部 blocking）。
      既有已确认规则 R-IP-001（同 Cluster 内 IP 唯一）、R-IP-002（跨 Cluster 可重复）、R-IP-003（不考虑 VRF）
      **保持不变**；F005 已 DONE 的实现与结论不被本项推翻，但 F005 契约排除的「IP 池 / 分配工作流」立场
      可能需按裁定修订。裁定结果可能要求：Product 在 requirements.md §12 新增 / 修订产品规则、新增或修订
      API 契约、并复核 F020 / F021 的 layers（database 很可能为 true）。
      **在裁定前，F020 / F021 保持 DRAFT 且不得实现。**
    resolution: >
      **RESOLVED（2026-09-20，用户裁定）**：用户采纳协调器的推荐方案，并将第 4 项明确为「**范围内仍有活跃 IP 时禁止删除**」。
      **F020 范围段（地址池）**：
      1) **表示与字段**：用 **start–end（含两端，IPv4 dotted-quad）** 表示，字段至少 `id / cluster_id /
      start_ip / end_ip / created_at / updated_at`；`start_ip <= end_ip`；**V1 仅 IPv4**。范围字段要求合法 IPv4 并规范化；
      **现有 `ip_addresses.ip_address` 的自由文本登记保持不变**。
      2) **重叠**：同一 Cluster 内活跃范围段**不得重叠**；跨 Cluster 允许相同范围（与 R-IP-002 一致）。
      3) **归属**：恰属于一个 Cluster（`cluster_id` 必选），不跨 Cluster 共享。
      4) **生命周期 / 删除**：支持修改 start/end；**软删**（不物理删除）；**当范围内仍有活跃 IP（同 Cluster、活跃、字面落在该范围内）时，禁止删除该范围段**；删除范围**不级联**删除已分配 IP。
      5) **无状态**：不设状态；活跃性仅由软删表达（沿用 Q-002=B）。
      6) **一致性**：不新增 DB 层「范围必须覆盖已分配 IP」硬约束；建议交付漂移检测查询。
      **F021 分配**：
      7) **分配产物**：创建一条现有 **IPAddress**（沿用 F005），不新建分配 / 预留实体。
      8) **目标 NIC**：**必选**指定一个活跃 NetworkInterface；Cluster 由 NIC→BareMetal 推导（复用 F005 受控推导）。
      9) **自动分配**：在该 Cluster 全部活跃范围段**并集**中取**数值最小的未占用 IPv4**（跨范围段全局最小）。
      10) **已占用判定**：同 Cluster 内存在**活跃（未软删）**且字面相同的 IPAddress ⇒ 占用；**软删释放**（R-DELETE-006）；
      **无隐式保留地址**（范围边界由用户给定，不自动跳过网络 / 广播 / 网关）。
      11) **手动分配**：必须落在某个活跃范围内且未占用；**范围外字面 IP 仍走现有 F005 登记端点**（向后兼容）。
      12) **耗尽**：无可用 IP → 明确的**非 500** 错误（建议 `409 CONFLICT` / `details[].code = NO_AVAILABLE_IP`，具体取值由 Architecture 定稿），不创建任何 IP。
      13) **唯一性 / 并发**：不新增超出 R-IP-001 的唯一性；以 R-IP-001 的 partial unique 索引为最终权威，并发冲突处理由 Architecture 定稿。
      **产品规则落点**：Product 须在 requirements.md §12 新增范围段与分配规则（编号由 Product 决定）；
      **R-IP-001 ~ R-IP-003 保持不变**。
      **未由产品裁定、留 Architecture**：不重叠的强制方式（应用层校验 + 漂移查询 vs Postgres 排它约束）、
      范围 / 分配契约形态、并发实现、错误码具体取值。

  - id: DEC-024
    type: product
    status: RESOLVED
    resolved_on: "2026-09-21"
    resolved_by: user
    topic: IP 地址范围段（网段）的自定义名称 / 子网掩码 / VLAN 元数据扩展与 R-IP-004 字段封闭的取舍
    question: >
      是否为每个自定义网段（IP 地址范围段）增加**自定义名称**、**子网掩码**与 **VLAN** 三个元数据？若增加：
      (a) 网段名称的唯一性 / 必填性 / 大小写语义（§22）/ 软删释放如何定义；
      (b) 子网掩码用 dotted-quad 还是 CIDR 前缀长度，V1 是否仅 IPv4，是否必填；
      (c) 掩码是否必须与 start–end 自洽（用户示例「10.1.1.1 到 10.1.2.10 掩码 255.255.255.0」跨 /24 边界，
          示例本身不自洽），若必须自洽则示例不合法；
      (d) VLAN 的整数取值域 / 保留值 / 是否唯一 / 是否可为空、与既有「同 Cluster 范围段不重叠」规则的关系；
      (e) 是否引入「同 Cluster 名称唯一」「同 Cluster VLAN 唯一」等超出 R-IP-001 的新唯一性；
      (f) 是扩展既有 `ip_address_ranges` 还是新独立实体，f020 契约是否修订，F021 分配是否按掩码 / VLAN 过滤。
      本诉求**直接冲突于已确认 R-IP-004**（明文「除 id/cluster_id/start_ip/end_ip/created_at/updated_at 外
      没有其它已确认字段；不得自行新增 name/description/用途」），必须由用户 / Product 裁定。
    impact_features: [F022, F020, F021, F005]
    resolution: >
      **RESOLVED（2026-09-21，用户采纳推荐方案）**：为 IP 地址范围段（网段）新增 3 个**可选**元数据字段
      `name` / `subnet_mask` / `vlan`，并据此修订 R-IP-004（其余规则与 F020 / F021 结论不变）。裁定要点：
      1) **NQ-1 是否修订 R-IP-004**：修订——为范围段新增可选 `name` / `subnet_mask` / `vlan`；其它字段（description / 用途等）仍不新增。
      2) **NQ-2 名称**：可选（可空）；**同一 Cluster 内活跃网段唯一**；**区分大小写**（§22）；**软删释放**（R-DELETE-006）；跨 Cluster 可重复。
      3) **NQ-3 掩码表示**：**dotted-quad IPv4**（如 `255.255.255.0`），可选；**V1 仅 IPv4**，不使用 CIDR 前缀。
      4) **NQ-4 掩码一致性**：**不强制**掩码与 start–end 自洽；掩码为描述性元数据，仅须为**合法 IPv4 掩码**（连续 1 后连续 0）。
         用户示例 `10.1.1.1 到 10.1.2.10 掩码 255.255.255.0` 跨 /24 边界，按本裁定**允许**（不校验范围归属）。
      5) **NQ-5 VLAN**：**整数 1–4094**（0 / 4095 保留），可选；**不唯一**（同 Cluster 多网段可共用同一 VLAN）。
      6) **NQ-6 新增唯一性**：仅新增「**name 同 Cluster 活跃唯一**」；**不新增 VLAN 唯一**；其余仍以 R-IP-001 为唯一性边界。
      7) **NQ-7 承载方式 / 既有影响**：**扩展既有 `ip_address_ranges` 表加 3 个可空列**；**精确修订 f020 契约（纯增量）**；
         **不推翻** F020 / F021 既有结论；**V1 分配不按掩码 / VLAN 过滤**（F021 语义不变）。
      8) **NQ-8 迁移**：migration `0010_f022_ip_range_metadata`（`down_revision="0009_f020_ip_address_ranges"`），
         3 个可空列 + name 的 partial unique（`WHERE deleted_at IS NULL AND name IS NOT NULL`）；**无数据回填**（既有行取 NULL）。
      **产品规则落点**：Product 须在 requirements.md §12 **修订 R-IP-004**（新增字段与语义）；R-IP-001 ~ R-IP-010 其余部分保持不变。
      具体契约 / 迁移实现由 Architecture 在 Feature Workflow 内定稿。
    note: >
      **已由用户于 2026-09-21 裁定（RESOLVED）**：本项为产品语义 / 已确认规则修订取舍，PM 与协调器均未自行裁定。
      完整歧义清单见 `features[F022].open_questions`（NQ-1 ~ NQ-8，已随本裁定解除 blocking），逐条对应见上方 `resolution`。
      **既有结论不变**：R-IP-001 ~ R-IP-010（除 R-IP-004 按本裁定修订）保持不变；F020 / F021 已 DONE 的实现与结论未被本项推翻；
      F005 的 `ip_address` 自由文本立场不变。后续由 Product 落 §12 规则、Architecture 定稿 f020 契约与 migration 0010。

  - id: DEC-025
    type: product
    status: RESOLVED
    resolved_on: "2026-09-22"
    resolved_by: user
    topic: 自动分配 IP 地址时是否 / 如何指定所用的 IP 地址范围段（修订 R-IP-006 / R-IP-009）
    question: >
      当同一 Cluster 配置多套活跃 IP 地址范围段时，自动分配（`POST /api/ip-addresses/allocate`）当前在
      全部活跃范围段的并集内取数值最小未占用 IPv4（R-IP-006），无法选择使用哪一套范围。是否允许 / 要求
      调用方显式指定一个范围段？若指定：(a) 该字段必填还是可选；(b) 所选范围段须满足哪些约束（活跃 / 属于
      目标 NIC 推导出的 Cluster）；(c) 所选范围段耗尽时是硬失败还是回退到其它范围；(d) 手动分配是否受影响。
      本诉求直接修订已确认 R-IP-006 / R-IP-009，须由用户裁定。
    impact_features: [F023, F021, F020]
    resolution: >
      **RESOLVED（2026-09-22，用户裁定）**：
      1) **必填**：自动分配**必须显式指定**一个 IP 地址范围段；`POST /api/ip-addresses/allocate` 请求新增必填字段
         `ip_address_range_id`；不再存在“全部范围并集取全局最小”的隐式行为。
      2) **范围归属**：所选范围段必须**活跃**且**恰属于**目标 NIC 推导出的 Cluster；不满足则分配被拒（非 5xx），不创建任何 IP。
      3) **耗尽语义**：在**所选单个范围段**内取数值最小未占用 IPv4；该范围段耗尽 → `409 CONFLICT + NO_AVAILABLE_IP`，
         **不回退**到其它范围段，也不跨 Cluster 取址。
      4) **手动分配不变**：`POST /api/ip-addresses/allocate-manual` 语义与本次之前一致（输入 IP 本身决定范围）。
      5) **既有边界不变**：占用判定按字面、范围归属按数值（R-IP-007）、R-IP-001 partial unique 为唯一性最终权威（R-IP-010）、
         无隐式保留地址、无部分写入、`/allocate-manual` 与 F005 登记端点不变；**不新增任何唯一性 / 不新增数据库 Schema**。
      产品规则落点：Product 须修订 requirements.md §12 **R-IP-006**，并相应澄清 **R-IP-009**（耗尽限定为所选范围段）。
      契约 / 前端实现由 Architecture 在 Feature Workflow 内定稿。
    note: >
      **已由用户于 2026-09-22 裁定（RESOLVED）**。本项为对已确认规则 R-IP-006 / R-IP-009 的修订诉求，
      PM 与协调器均未自行裁定。诊断依据：f021 契约 §1.6 / §3.1 与 `backend/app/ip_allocations/schemas.py`
      （`IpAddressAutoAllocateRequest` 字段恰为 `{network_interface_id}`）证明自动分配**无法**指定范围——属规则限制而非实现缺陷。
      **既有结论不变**：R-IP-001 ~ R-IP-005、R-IP-007、R-IP-008、R-IP-010 原样保留；F020 / F021 已 DONE 的实现与
      其它结论未被推翻（仅按本裁定修订 R-IP-006 / R-IP-009 并据此修订 f021 契约）。

