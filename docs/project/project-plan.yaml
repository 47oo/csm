- id: F034
  title: 导入 CSV 文本载体
  kind: FEATURE
  priority: P1
  milestone: M25 导入文本载体
  scope: 在前端批量导入页新增第三种输入载体「粘贴 CSV 文本」：把用户粘贴的 CSV 文本按 UTF-8 编码为字节，以既有 multipart `file`
    字段（format=csv）提交，复用 F014 `/api/v1/imports/resources*` 与 F023 `/api/v1/imports/resource-interfaces-ips*`
    的预校验 / 写入端点；服务端零代码变更，不新增端点、查询参数、错误码、权限或 Schema。沿用既有「先预校验、再确认写入」两步流程与整批成功 / 整批回滚语义，写入时仍重新提交同一内容并完整重校验；模板、列名与列序、CSV
    解析、行号、错误呈现、权限与 Audit 路径均不变。文本固定 format=csv（不提供文本载体上传 .xlsx）；本地只拦截空（含纯空白）输入与 5
    MiB 字节上限，行数上限不在本地镜像、以服务端 413 `IMPORT_FILE_TOO_LARGE` 及 `IMPORT_*` 为权威。输入指纹由 file+format
    扩展为 carrier（file | text）+ format + 内容摘要：文本载体取内容摘要，文件载体保留文件名 / 大小 / 修改时间，载体或内容任一变化即令既有预校验结果失效。不新增
    npm 依赖；同步处理。明确不做：新端点或参数、Service Layer / Schema / 迁移改动、文本载体 .xlsx、模板编辑、本地行数上限或分隔符自动探测、多文件批量或流式上传、跳过预校验直接写入。载体切换与文本域交互细节由本
    Feature ARCHITECTURE（前端）在 Contract 增补节签核边界内确定。
  acceptance: 通过 requirements revision 13 新增测试项（拟 T107–T112，ID 以 revision 13 落稿为准）；文本载体与同字节
    CSV 文件走同一预校验 / 写入端点，响应形状、行号、错误码、权限与 file 载体一致（F014 / F023 既有契约零回归）；空与纯空白文本本地拦截且不发请求；超过
    5 MiB 文本本地拦截，服务端 413 口径一致；行数超 5000 不在本地拦截、由服务端权威拒绝且无部分写入；载体或内容变化后旧预校验结果失效、必须重新预校验；无新增依赖、既有
    file/.xlsx 载体行为与其它页面无回归。`docs/api/F014.md` 与 `docs/api/F023.md` 的「CSV 文本载体（加法引用）」增补节须在本
    Feature CONTRACT 阶段由 Architect 签核后方可作为实施依据。
