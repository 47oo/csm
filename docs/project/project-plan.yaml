# ---------------------------------------------------------------------------
# Planning Status
# ---------------------------------------------------------------------------
planning_status:
  plan_completeness: complete
  status: ACCEPTED
  ready_features: []
  blocked_draft_features:
    BLOCKED: []
    DRAFT: []
  counts:
    READY: 0
    IN_PROGRESS: 1
    BLOCKED: 0
    DRAFT: 0
    DONE: 20
    CANCELLED: 1
  status_decision_rules:
    DRAFT: >
      存在未解决的产品问题，且该问题直接影响本 Feature 自身 scope 或 acceptance_criteria
      的定稿（自身数据模型 / 字段 / 唯一性 / 生命周期 / 校验策略等产品语义尚未确认）。
    BLOCKED: >
      本 Feature 的 scope 与 acceptance_criteria 已可定稿，仅被 architecture / database
      decision、未 DONE 的 depends_on 或环境阻塞。
    both: >
      两类原因同时存在时取 DRAFT，并在该 Feature 的 blocking 中同时列出两类原因。
    note: >
      仅被其他 Feature 的产品决策间接影响、不改变本 Feature 交付边界时，仍按 BLOCKED 处理。
      判定依据见本文件顶部注释与 .pi/agents/project-manager.md §8。
  done_rationale:
    F022: >
      base dae7fe9 → head fbfc968（实现 65e0cce / 测试 fbfc968）→ merge b467e89（--no-ff 合入 develop；集成树与已审阅候选 fbfc968 逐字节一致，
      父提交为 dae7fe9 与 fbfc968）。Reviewer verdict = **APPROVED WITH FOLLOW-UP**（无 BLOCKER / HIGH / 必须修复的 MEDIUM）。
      验收：协调器独立复跑（真实 PostgreSQL 16.15）后端全量 1228 passed / 0 failed、F022 专项 101 passed、前端 typecheck + 784 passed + build、ruff 干净。
