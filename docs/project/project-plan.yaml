scope:
  included:
    - 集群主数据登记、选择与作为资源归属；集群 code 全局唯一且创建后不可改、真实删除后永不复用；名称仅字母/中文/下划线/数字、含空格直接拒绝、仍存集群内区分大小写唯一、真实删除后可复用；用途可维护
    - 集群真实删除保护：存在仍存计算资源、网段或服务业务关联时禁止删除，须先显式逐项处理，不级联；仅余历史中已解除的关联不阻止删除
    - 计算资源统一身份与登记：统一资源列表/详情、类型切换、筛选分页、按名称/IP 搜索（当前集群作用域）
    - 计算资源一次原子提交：公共信息 + 类型详情 + 全部网卡 + 全部 IP（公共信息+网卡+IP 由 F002/F006 在 M1 交付，类型详情由 F004 在 M2 扩展）
    - 同名新增显式确认进入既有资源编辑（不创建第二条、不自动覆盖或合并）
    - 管理 IP 从本资源仍存网卡 IP 指定、可空，删除时须同次显式清空/重选
    - 资源并发编辑冲突保护：冲突提示、保留输入、不静默覆盖或自动合并
    - 计算资源真实删除与资源历史：删除前逐项先删其网卡/IP 等仍存子项，无恢复入口；删除/变更记录资源历史（操作人 + 内容），P0 仅平台管理员可查、不自动到期
    - 计算资源类型详情：裸金属 SN/CPU/内存/GPU 等；VM 宿主/vCPU/内存；宿主反查 VM
    - 网段管理：CIDR、用途、技术类型、VLAN、网关、自动分配范围、保留地址、真实删除（无停用/逻辑删除状态）
    - 网段真实删除前置：逐项删除全部已分配地址、逐条删除保留地址、显式清空网关；删后历史配置不参与任何分配排除；仍存网段间跨重叠排除不变
    - 同集群重叠网段仅提示风险并允许保存；保留地址/网关须在所属 CIDR 内且跨重叠网段排除分配
    - 网卡网段可选（0..1），分配 IP 前必须选定
    - IPv4 手动与自动分配、真实删除释放与重用、并发唯一、耗尽处理；可自动分配数量为当前实际可自动分配地址数快照、非预占
    - 服务与部署实例：跨集群关联、允许零关联与解除最后一条关联、访问入口按服务 × 集群 0..N 且逐条真实删除、节点角色、双向查询
    - 服务真实删除与解除关联保护：存在部署实例时拒绝，不级联删除实例；服务编号真实删除后不复用；服务与入口删除/变更历史
    - VIP 与节点网卡 IP 分开记录，登记 VIP/监听地址不产生 IP 分配记录
    - 统一模糊搜索与下拉交互规范（所有搜索框/单选/多选/枚举），仅匹配仍存对象
    - 独立全局 IP 查询入口（跨集群结果，与当前集群资源页区分）与集群入口聚合计数（仅统计仍存对象）
    - 平台自建用户与角色管理：用户增删改（用户名 + 初始口令 + 单一角色）、单一角色（运维查看者/资源维护者/平台管理员）分配、登录/登出、改密/重置、账号禁用；仅平台管理员维护、服务端校验
    - 账号生命周期语义：删除用户保留历史审计且用户名不复用；禁用≠删除（禁用禁止登录但保留用户记录、可重新启用）
    - 口令策略：最短 8 位且同时含字母与数字；P0 不强制定期过期；用户可自助改密、平台管理员可重置；无自助找回
    - 用户与角色管理审计：按 §9.1 记录操作者、时间与关键变更，不并入仅管理员可查的受管资源历史
    - 首个平台管理员部署预置，首登须修改初始口令
    - 权限与审计：平台角色/操作者解析与会话基础由 F013 交付；各受管对象服务端三角色鉴权、操作审计与历史写入随对象当期交付；集群选择非授权边界
    - 资源历史保留与管理员查询：删除/变更历史不随真实删除消失，P0 仅平台管理员可查、不自动到期清除
    - 非功能与可用性目标：常用列表/详情 P95 < 1s、搜索 P95 < 1.5s（约 1,000 台/集群基线）
    - 部署与备份取舍：仅内网 HTTP、不启用 HTTPS；P0 不做备份、不做恢复演练（接受数据丢失风险），不降低并发保护与整单原子要求
    - 计算资源真实删除依赖：删宿主机前逐项真删 VM；删任一计算资源前逐项真删指向它的服务部署实例；删除上级不自动改挂
    - 非功能与可用性基线：服务端分页、时区、状态文字、键盘、横向滚动、并发保护、无半条数据
  excluded:
    - 自动发现
    - 故障告警
    - Excel/CSV 导入
    - Excel/CSV 导出
    - 批量更新
    - 完整 CMDB 生命周期
    - DHCP
    - 自动修改服务器网络配置
    - VM 自动创建、迁移、启停
    - 服务自动部署与健康检查
  excluded_note: >
    以上为 P0 范围外（requirements-v2.md §3.2），不构成永久排除。
    requirements-v2.md 未确认任何非 P0 范围，故本计划不登记 P1/P2 Feature，
    避免在无已确认需求支撑下预建框架。

# --- Epics：产品能力域 ---
epics:
  - id: E1
    title: 集群与全局导航
    goal: 集群主数据登记、身份与真实删除保护、选择与作为资源归属；集群入口聚合概览、当前集群搜索作用域与独立全局 IP 查询。
    features: [F001, F010]
  - id: E2
    title: 计算资源统一身份与登记
    goal: 裸金属与 VM 共用资源身份，统一列表/详情、无 IP 网卡基础与一次提交、同名确认、并发保护与真实删除及资源历史；IP 分配由 E4 在同一表单集成。
    features: [F002, F003]
  - id: E3
    title: 类型详情与宿主关系
    goal: 在 F002/F003 基础上扩展类型专有详情、列表/详情类型摘要；VM 关联同集群仍存裸金属宿主并支持双向查询；删宿主前逐项真删 VM。
    features: [F004]
  - id: E4
    title: 网段与 IPv4 分配
    goal: 集群多网段维护与 IPv4 手动/自动分配、保留地址与唯一性保障；重叠网段提示与跨段排除；网段真实删除前置与历史写入；IP 在资源表单内集成。
    features: [F005, F006]
  - id: E5
    title: 服务与部署实例
    goal: 服务跨集群关联、零关联与最后关联解除、入口逐条真实删除、部署实例与节点角色、删除/解除关联保护与服务/入口历史。
    features: [F007]
  - id: E6
    title: 通用检索与下拉
    goal: 所有搜索框与下拉支持可输入模糊匹配（基础能力与已交付对象适配），服务端模糊查询与稳定排序；宿主/服务/全局 IP 查询按同一规范适配。
    features: [F008]
  - id: E7
    title: 资源历史、权限审计复核与非功能基线
    goal: 各对象当期交付三角色服务端鉴权与操作审计；E7 负责资源历史与管理员查询、跨对象权限/审计一致性复核、全平台终局复核及性能/可靠性与可用性基线。
    features: [F009, F011, F012]
  - id: E8
    title: 平台访问控制与用户管理
    goal: 平台自建用户与角色管理、登录会话与平台角色/操作者解析基础；用户/角色管理操作审计（不并入受管资源历史），作为全部受管对象服务端鉴权与操作审计的身份前提。
    features: [F013]

# --- Features ---
# 每项：id、title、epic、type、goal、scope、out_of_scope、acceptance、
#       acceptance_scenarios（本 Feature DONE 时主要验收归属/可独立核验部分）、
#       acceptance_note（联验说明）、priority、depends_on、blocking_decisions、
#       status、layers、implementation、contract、git、evidence
#
# 验收原则：Feature DONE 必须具备当时依赖已完成、可独立核验的用户可见价值。
# 场景的闭环归属见 requirement_coverage.scenarios.*.closure_owner。
features:
  - id: F001
    title: 集群登记、身份、真实删除保护与集群本体权限审计
    epic: E1
    type: FEATURE
    goal: >
      提供集群主数据登记、列表与选择，保证集群身份稳定，定义真实删除保护规则，
      并在 F013 交付的平台角色/操作者解析与会话基础上交付集群本体最小服务端鉴权、操作审计与资源历史写入，
      作为所有资源归属与后续对象鉴权的前提。
    scope: >
      集群 code/名称/用途登记与查询；code 去首尾空格+统一大写全局判重（含已真实删除者等价即拒绝）、
      创建后不可改、真实删除后永不复用；名称仅允许字母/中文/下划线/数字、含空格（含首尾/中间）直接拒绝、
      仍存集群内区分大小写唯一、真实删除后可复用；用途可改。集群列表/选择并记住本次选择；
      作为计算资源、网段、服务归属。真实删除保护：仍存计算资源/网段/服务业务关联须先显式逐项删除/解除，
      不级联；仅余历史中已解除关联不阻止删除；删除后审计与资源历史保留。
      复用 F013 交付的平台角色/操作者解析与会话基础：统一三角色（查看者/资源维护者/平台管理员）识别
      与操作者身份解析由 F013 提供，本 Feature 不再自行交付（认证源与审计期限按 BQ-V）。
      集群本体最小服务端鉴权：查看者不得新增/修改/删除；资源维护者/平台管理员可真实删除且仍须满足关联保护；
      集群新增/编辑由平台管理员维护；权限均在服务端校验。集群操作审计记录操作者、时间与关键变更；
      集群删除/变更历史写入（至少操作人 + 内容，无恢复入口；查询与“不自动到期”由 F012 统一提供）。
      本 Feature 独立闭环场景 71；场景 58 的跨对象改名归属不在本 Feature 闭环。
    out_of_scope: >
      其他受管对象的鉴权/审计/历史写入（F002/F005/F006/F007，各自当期交付）与其一致性复核（F009）；
      聚合计数与全局 IP 查询（F010）；计算资源/网段/服务实现（F002/F005/F007）；资源历史查询（F012）。
    acceptance:
      - requirements-v2.md §4.1.1、§4.1.6–4.1.9
      - requirements-v2.md §6.1（集群编号/名称/用途/选择记忆）
      - requirements-v2.md §4.4（集群真实删除与资源历史保留）
      - requirements-v2.md §2.1、§9.1（集群本体三角色服务端鉴权与操作审计）
      - requirements-v2.md §10 场景 71
      - requirements-v2.md §10 场景 50、51、58、59、61、64（规则定义与联验部分）
    acceptance_scenarios:
      - "71（集群本体新增/编辑/空关联真实删除 + 最小三角色服务端鉴权与操作审计；管理员查询由 61/64 联验）"
    acceptance_note: >
      场景 50 中“已登记资源的所属集群不可通过普通编辑修改”由 F002 验收；
      场景 51 的完整闭环需 F002（计算资源）、F005（网段）、F007（服务关联）分别引入关联，
      由 F007 在 M3 完成三类关联齐全的最终闭环；场景 58 的跨对象改名归属由 F007 闭环；
      场景 59 的上级逐项先删规则侧、61/64 的历史写入与持久化在 F001 DONE 时可独立校验，
      管理员查询需 F012 交付后由 61/64 联验；场景 57 由 F011 终局复核。
      本 Feature 复用 F013 交付的角色/操作者解析与会话基础，不自行交付该基础。
      F001 不承诺有关联集群删除保护与资源历史查询的完整验收。
