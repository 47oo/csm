decisions_required:
  - id: DEC-001
    question: >
      领域模型 domain-model.md 仍含 DataCenter 且规定 Cluster→DataCenter 绑定必选、
      DataCenter 名称全局唯一；requirements.md §6 明确 V1 不建立 DataCenter 层级。
      需确认以 requirements.md 为准，并安排 domain-model.md 的修正范围（修正不属于本计划）。
    impact_features: [F001, F002, F009, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：依用户明确指令，V1 不含 DataCenter，以 requirements.md §6 为准；
      domain-model.md 已同步移除 DataCenter（Cluster 为基础设施顶层对象）。
      F001/F002/F009/F010/F011 验收标准均不含 DataCenter 维度。

  - id: DEC-002
    question: >
      requirements.md §13 定义 Rack 与 U 位冲突硬阻断，但 domain-model.md 的 taxonomy /
      关系 / 唯一性完全不含 Rack。需确认 Rack / U 位是否进入 V1 领域模型，以及领域模型文档如何同步。
    impact_features: [F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：Rack / U 位已从 V1 产品范围删除（requirements.md §13 改为「V1 不管理 Rack 与 U 位」，
      原 4 条 Rack 规则（R-RACK 序列）全部删除）。对应 Feature F003 一并删除。

  - id: DEC-003
    question: >
      Service 关系模型冲突：requirements.md（Service N:N Cluster，可被多 Cluster 共享，
      不得强制 service.cluster_id）vs domain-model.md（Service 绑定 VM/Container/BareMetal 运行载体，必选）。
      两套模型互斥，需确认 V1 采用哪一种。
    impact_features: [F008, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：采用方案 C。Service 必选绑定运行载体（BareMetal / VM / Container），可绑定多个；
      Service 与 Cluster 的关联由载体归属推导。已落为 requirements.md R-SVC-005 / R-SVC-006，
      domain-model.md §5.5 / §6 同步确认。F008 相应依赖 F006 / F007。

  - id: DEC-004
    question: >
      VirtualMachine 与物理宿主关系模型的强制性及生命周期规则：requirements.md R-VM-003 要求
      在 Feature Product 阶段确认，domain-model.md 规定 VM→BareMetal 必选。需确认。
    impact_features: [F006, F007, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-16，用户裁定）：VM→BareMetal 绑定为**必选**；Cluster 归属由宿主推导；
      宿主 BareMetal 存在活跃 VM 时不得删除宿主（R-DELETE-004）；VM 软删不级联（R-DELETE-005）。
      已落为 R-VM-005，并同时关闭 OPEN-001（name 全局唯一、大小写敏感）与新增 R-VM-006（可选字段）。

  - id: DEC-005
    question: >
      Container 登记粒度、生命周期与运行关系（绑定 VM / BareMetal 是否必选）：
      requirements.md §10 要求在 Feature 阶段确认，domain-model.md 规定必选。需确认。
    impact_features: [F007, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-16，用户裁定）：登记粒度为长期服务型 Container 实例；绑定运行载体
      （BareMetal 或 VirtualMachine）为必选且恰好一个，Cluster 由载体推导；name 同一载体内唯一；
      载体有活跃 Container 不得删除；软删不级联。已落为 R-CONTAINER-001 ~ R-CONTAINER-005，并关闭 OPEN-002。

  - id: DEC-006
    question: >
      VM / Container / Service / NetworkInterface / IPAddress 的状态模型未在 requirements.md 确认
      （仅确认 BareMetal 状态与 Cluster 无状态）。domain-model.md §7.2/§7.3 定义了这些状态枚举。
      需确认这些状态是否属于 V1 已确认需求。
    impact_features: [F004, F005, F006, F007, F008]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：采用方案 B。V1 仅 BareMetal 有状态；VM / Container / Service /
      NetworkInterface / IPAddress 均不设状态。domain-model.md §7 已重写同步。

  - id: DEC-007
    question: >
      Cluster 名称不得包含 `/` 的规则来源不明：domain-model.md §5.1/§8 有该规则（用于 URL 路径寻址），
      requirements.md 未提及。需确认是否为已确认产品规则。
    impact_features: [F001]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：确认为 V1 产品规则，已落为 requirements.md R-CLUSTER-005
      （Cluster 名称不得包含 `/`，写入路径强制校验拒绝）。

  - id: DEC-008
    question: >
      domain-model.md §4 将信息分为静态/动态并采用通用 status 统一建模，且声明所有绑定必选；
      requirements.md §16/§21 未如此表述。需确认是否采纳该统一建模方式。
    impact_features: [F006, F007, F008]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0002 ACCEPTED）：统一 `status` 建模已由架构裁定 ——
      `bare_metal.status` 为显式列 + CHECK（IDLE/ALLOC/DOWN/UNKNOWN），**不设通用 status 表**；
      其余资源在 V1 不设状态。符合 requirements.md §4（不同资源可有独立数据模型与状态）
      与 §24（禁止 EAV / 通用 resources 表 / STI / JSONB 万能模型）。

  - id: DEC-009
    question: >
      项目技术栈与整体架构未确定：无 docs/architecture/、无 ADR、无技术选型。
      这是所有 Feature 的前置阻塞。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012, F013, F014, F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0001 ACCEPTED）：技术栈为 Python + FastAPI + Pydantic +
      SQLAlchemy 2.x + Alembic；Vue 3 + TypeScript + Vite + Element Plus；单体分层架构。
      API 契约部分见 DEC-014 / ADR-0003。

  - id: DEC-010
    question: >
      数据库选型、持久化方案、Schema 设计与迁移策略未确定：无 docs/database/、无 Migration。
      需经 Architecture / Database 流程决策。
    impact_features: [F004, F005, F006, F007, F008, F012, F015]
    type: database
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0002 ACCEPTED）：采用 PostgreSQL；大小写敏感唯一性由显式
      collation / 数据库默认行为保证（以测试固定）；“已删不占唯一性”由 partial unique index
      (`WHERE deleted_at IS NULL`) 保证；Alembic 版本化向前 migration。
      DEC-015 规模假设（10⁵ / 50 并发）在该选型阈值内，无需重审。

  - id: DEC-011
    question: >
      全局资源标识与 URL 寻址策略未确定（资源主键方案、按名称寻址等），影响所有资源 CRUD 与查询。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0003 ACCEPTED）：所有资源使用不可变 BIGINT identity 代理主键 `id`；
      写操作一律走 `id` 路径；Cluster 额外提供 `by-name` 只读路径别名（大小写敏感，已删不参与解析）。

  - id: DEC-012
    question: >
      逻辑删除的持久化实现方式（删除标记字段等）与「已删除资源不占用唯一性」的释放语义细节未确定。
    impact_features: [F014, F001, F002, F004, F005, F006, F007, F008]
    type: database
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0004 ACCEPTED）：所有资源表使用单一 `deleted_at TIMESTAMPTZ NULL`；
      常规查询一律带 `deleted_at IS NULL`；“已删不占唯一性”由 partial unique index 保证；
      父删子拦、不级联在同一事务内加行锁实现。

  - id: DEC-013
    question: >
      本地账号认证的具体实现范围（口令策略、会话机制、最小权限边界）未确定；
      requirements.md 仅确认使用本地账号且不扩大为复杂 RBAC。
    impact_features: [F013, F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0005 ACCEPTED）：服务端会话（DB 会话表 + HttpOnly Cookie）+
      Argon2id 口令哈希；V1 仅「已认证 / 未认证」两种边界，不做 RBAC。

  - id: DEC-014
    question: >
      API 契约与错误响应规范未确定：无 docs/api/。需统一冲突/校验错误的返回结构，
      以支撑 §21 数据一致性与 R-IMPORT-003 的逐行错误提示。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0003 ACCEPTED）：REST + JSON + `/api` 前缀；自定义 Problem 风格错误信封
      + 稳定 `code`；逐行错误用 `details[].row/.field/.code` 承载 R-IMPORT-003；集合空返回 200 空数组、
      父不存在返回 404（R-QUERY-004）；导入语义为 All-or-Nothing。规范落盘 docs/api/api-conventions.md（READY）。

  - id: DEC-015
    question: >
      资源规模量级与并发假设未确定（BQ-1）：影响数据库选型与部署配置是否需要分区 / 异步导入。
    impact_features: [F012, F015]
    type: process
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，用户裁定）：资源总量约 10⁵（10 万级），并发用户约 50。
      结论来自用户确认；在该阈值内单机 PostgreSQL 足够，DEC-010 选型无需重审。
      见 csm-v1-foundation-architecture.md「规模假设与阈值」。

  - id: DEC-017
    type: product
    status: RESOLVED
    topic: 口令强度策略
    resolution: >
      用户 2026-09-15 裁定：口令长度至少 8 位（R-AUTH-004）。除长度下限外不要求大小写混合 / 数字 / 符号，
      也不做弱口令黑名单。适用于任何建立或修改口令的路径。
  - id: DEC-018
    type: product
    status: RESOLVED
    topic: 用户名大小写语义
    resolution: 用户 2026-09-15 裁定：用户名唯一性与登录匹配均区分大小写（R-AUTH-005）；不得使用 lower(username) 折叠。
  - id: DEC-019
    type: product
    status: RESOLVED
    topic: 登录失败响应语义
    resolution: 用户 2026-09-15 裁定：登录失败统一响应，不区分「用户名不存在」与「口令错误」（R-AUTH-006）。
  - id: DEC-016
    question: >
      部署打包方式未确定（BQ-4）：影响 F015 内网部署的交付形态。
    impact_features: [F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，用户裁定，ADR-0001 ACCEPTED）：采用 docker-compose 打包
      （nginx + 应用 + PostgreSQL）。原架构建议为 systemd + nginx，用户改为 docker-compose。

