epics:
  - id: E01
    name: 基础资源管理
    description: Cluster / BareMetal 等基础设施资源的登记与唯一性管理。
    features: [F001, F002]
  - id: E02
    name: 网络资源管理
    description: NetworkInterface 与 IPAddress 的登记、唯一性与关联。
    features: [F004, F005]
  - id: E03
    name: 虚拟资源管理
    description: VirtualMachine 与 Container 的资源模型与人工登记。
    features: [F006, F007]
  - id: E04
    name: 服务资源管理
    description: Service 资源及其与 Cluster 的共享关联。
    features: [F008]
  - id: E05
    name: 资源查询与视图
    description: 从 Cluster 视角及资源详情视角查询资源与关系。
    features: [F009, F010]
  - id: E06
    name: 数据导入
    description: Excel 模板与批量资源导入。
    features: [F011]
  - id: E07
    name: 平台基础能力
    description: 项目基础框架、本地认证、逻辑删除与一致性治理、内网部署（ENABLER）。
    features: [F012, F013, F014, F015]

# ---------------------------------------------------------------------------
# Features
# 状态规则见 .pi/agents/project-manager.md §8 及本文件顶部 / planning_status.status_decision_rules。
# 判定要点：
#   DRAFT   — 存在影响本 Feature 自身 scope / acceptance_criteria 定稿的未解决产品问题。
#   BLOCKED — scope / acceptance_criteria 已可定稿，仅被 architecture / database decision、
#             未 DONE 的 depends_on 或环境阻塞。
#   两类原因同时存在时取 DRAFT，并在 blocking 中同时列出。
# 说明：架构已批准（ADR-0001 ~ 0005 ACCEPTED，API 契约 READY），DEC-008 ~ DEC-016 全部 RESOLVED；
#       F012 无 depends_on 且无阻塞决策，已满足 READY 全部条件；其余 Feature 因依赖未 DONE（BLOCKED）
#       或存在 Feature 级产品问题（DRAFT）而尚未 READY。
# ---------------------------------------------------------------------------
features:
  # ---- E07 平台基础能力（ENABLER，逻辑上最先，但被架构决策阻塞） ----
  - id: F012
    name: 项目基础框架与运行环境
    kind: ENABLER
    epic: E07
    priority: P0
    status: READY
    depends_on: []
    blocking: []
    product_document: docs/product/requirements.md
    requirements:
      - "§4 Resource 概念（仅分类体系，不产生数据库继承）"
      - "§5 Resource Taxonomy"
      - "§21 Data Consistency（通用校验与冲突错误处理基座）"
      - "§24 Resource Taxonomy 与数据库设计（禁止 EAV / 通用 resources 表 / STI / JSONB 万能模型）"
      - "§25 产品核心原则"
    acceptance_criteria:
      - 存在可运行的项目骨架与本地开发/运行环境。
      - 资源类型采用显式建模，不引入 EAV、通用 resources 表、STI 或 JSONB 万能资源模型。
      - 提供通用数据校验与冲突错误处理基座，支持各资源 Feature 复用（§21）。
    open_questions: []

  - id: F013
    name: 本地账号认证与会话
    kind: ENABLER
    epic: E07
    priority: P0
    status: BLOCKED
    depends_on: [F012]
    blocking:
      - "依赖 F012 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-AUTH-001
      - R-AUTH-002
      - R-AUTH-003
    acceptance_criteria:
      - 使用系统本地账号进行登录认证（R-AUTH-001）。
      - 不接入 LDAP / AD / OAuth / 企业 SSO（R-AUTH-002）。
      - 不在无明确产品需求时扩大为复杂 RBAC（R-AUTH-003）。
    open_questions: []

  - id: F014
    name: 逻辑删除与数据一致性治理
    kind: ENABLER
    epic: E07
    priority: P0
    status: BLOCKED
    depends_on: [F012]
    blocking:
      - "依赖 F012 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-DELETE-001
      - R-DELETE-002
      - R-DELETE-003
      - R-DELETE-004
      - R-DELETE-005
      - R-DELETE-006
      - "§21 Data Consistency"
    acceptance_criteria:
      - 正常产品操作不物理删除核心资源记录（R-DELETE-001）。
      - 已逻辑删除资源默认不出现在常规查询（R-DELETE-002）。
      - V1 不提供 Undelete / Restore（R-DELETE-003）。
      - 父资源存在活跃子资源时不允许删除父资源（R-DELETE-004）。
      - 逻辑删除不自动级联删除子资源（R-DELETE-005）。
      - 已逻辑删除资源不再占用正常业务唯一性，可重新创建同名资源（R-DELETE-006）。
      - 关键冲突在保存前阻止，不仅依赖 UI 校验（§21）。
    open_questions: []

  - id: F015
    name: 内网部署与运行环境
    kind: ENABLER
    epic: E07
    priority: P0
    status: BLOCKED
    depends_on: [F012, F013]
    blocking:
      - "依赖 F012 / F013 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-DEPLOY-001
      - R-DEPLOY-002
      - R-DEPLOY-003
    acceptance_criteria:
      - CSM V1 部署在独立内网虚拟机（R-DEPLOY-001）。
      - 系统主要通过内网访问（R-DEPLOY-002）。
      - V1 使用 Internal IP + HTTP，不自动增加公网入口/域名/HTTPS（R-DEPLOY-003）。
    open_questions: []

  # ---- E01 基础资源管理 ----
  - id: F001
    name: Cluster 登记与管理
    epic: E01
    priority: P0
    status: BLOCKED
    depends_on: [F012]
    blocking:
      - "依赖 F012 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-CLUSTER-001
      - R-CLUSTER-002
      - R-CLUSTER-003
      - R-CLUSTER-004
      - R-CLUSTER-005
      - "§22 Case Sensitivity"
    acceptance_criteria:
      - Cluster 拥有可被运维人员识别的名称（R-CLUSTER-001）。
      - Cluster Name 在所有当前有效 Cluster 中全局唯一，且比较区分大小写（R-CLUSTER-002, §22）。
      - Cluster 不设置统一运行状态（R-CLUSTER-003）。
      - Cluster 可包含多个 BareMetal（R-CLUSTER-004）。
      - Cluster 名称不得包含 `/`，登记写入路径必须校验并拒绝含 `/` 的名称（R-CLUSTER-005）。
    open_questions: []

  - id: F002
    name: BareMetal 登记与管理
    epic: E01
    priority: P0
    status: DRAFT
    depends_on: [F001]
    blocking:
      - "OPEN-004 未确认（BareMetal 硬件字段范围）"
      - "依赖 F001 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-BM-001
      - R-BM-002
      - R-BM-003
      - R-BM-004
      - R-BM-005
      - R-BM-006
      - "§22 Case Sensitivity"
    acceptance_criteria:
      - 每个 BareMetal 必须属于一个 Cluster（R-BM-001）。
      - 同一 Cluster 内 hostname 唯一，不同 Cluster 可重复，比较区分大小写（R-BM-002, §22）。
      - 状态取自 IDLE / ALLOC / DOWN / UNKNOWN（R-BM-003）。
      - 新建默认状态为 IDLE（R-BM-004）。
      - 状态不得为空，历史未知用 UNKNOWN，不用 NULL（R-BM-005）。
      - 状态允许运维人员人工维护（R-BM-006）。
      - BareMetal 的直接上级只有 Cluster，不记录 Rack / U Position（requirements.md §13）。
    open_questions:
      - "OPEN-004：BareMetal 硬件字段（CPU / Memory / GPU / Storage / Vendor / Model / Serial Number 等）在 V1 的必填与可选范围。"

  # ---- E02 网络资源管理 ----
  - id: F004
    name: NetworkInterface 管理
    epic: E02
    priority: P1
    status: BLOCKED
    depends_on: [F002]
    blocking:
      - "依赖 F002 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-NIC-001
      - R-NIC-002
      - R-NIC-003
    acceptance_criteria:
      - 记录 technology_type，至少表达 Ethernet / InfiniBand / RoCE / Other（R-NIC-001）。
      - 记录 purpose，至少表达 BMC / Management / Business / Compute / Storage / DataTransfer / Other，内部枚举稳定（R-NIC-002）。
      - NetworkInterface 能与其所属资源建立明确关系，核心对象为 BareMetal（R-NIC-003）。
      - NetworkInterface 在 V1 不设状态（Q-002=B）。
    open_questions:
      - "R-NIC-003：VirtualMachine 等资源是否拥有独立 NetworkInterface（须由对应 Feature 确认，不得自动推导）。"

  - id: F005
    name: IPAddress 管理
    epic: E02
    priority: P1
    status: BLOCKED
    depends_on: [F004]
    blocking:
      - "依赖 F004 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-IP-001
      - R-IP-002
      - R-IP-003
    acceptance_criteria:
      - 同一 Cluster 中 IP 地址唯一，不存在两个有效资源占用相同 IP（R-IP-001）。
      - 不同 Cluster 之间允许相同 IP（R-IP-002）。
      - 当前不考虑 VRF，唯一性按 cluster + ip_address 理解（R-IP-003）。
      - IPAddress 在 V1 不设状态（Q-002=B）。
    open_questions: []

  # ---- E03 虚拟资源管理 ----
  - id: F006
    name: VirtualMachine 登记与管理
    epic: E03
    priority: P1
    status: DRAFT
    depends_on: [F002]
    blocking:
      - "OPEN-001 未确认（VM 字段与唯一性规则）"
      - "DEC-004（Feature 级，归属 F006 Product 阶段）"
      - "依赖 F002 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-VM-001
      - R-VM-002
      - R-VM-003
    acceptance_criteria:
      - 支持人工登记与查询 VirtualMachine（R-VM-001）。
      - 不要求自动接入 VMware / PVE / OpenStack 或其他虚拟化平台 API（R-VM-002）。
      - 关系模型能够表达实际运行位置；强制性与生命周期规则在 Feature Product 阶段确认，不自行推导（R-VM-003）。
      - VirtualMachine 在 V1 不设状态（Q-002=B）。
    open_questions:
      - "OPEN-001：VirtualMachine 字段（CPU / Memory / Disk / OS / Hypervisor / Owner 等）范围，以及标识与唯一性规则。"
      - "DEC-004（Feature 级，归属 F006 Product 阶段）：VM→BareMetal 绑定是否必选，以及生命周期规则（R-VM-003）。"

  - id: F007
    name: Container 资源模型与登记
    epic: E03
    priority: P1
    status: DRAFT
    depends_on: [F006, F002]
    blocking:
      - "OPEN-002 未确认（Container 管理粒度）"
      - "DEC-005（Feature 级，归属 F007 Product 阶段）"
      - "依赖 F006 / F002 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - "§10 Container（允许领域模型表达 Container 资源）"
    acceptance_criteria:
      - 领域模型能够表达 Container 资源（§10）。
      - 不因存在 Container 类型而引入 Kubernetes / Docker API / Container Runtime 自动发现（§10）。
      - Container 在 V1 不设状态（Q-002=B）。
    open_questions:
      - "OPEN-002：Container 管理粒度（是否登记每个 Container / 仅长期服务型 / 是否需要 K8s workload 等更高层对象）。"
      - "DEC-005（Feature 级，归属 F007 Product 阶段）：Container 绑定（VM 或 BareMetal）是否必选及生命周期规则。"

  # ---- E04 服务资源管理 ----
  - id: F008
    name: Service 资源管理与 Cluster 共享关联
    epic: E04
    priority: P1
    status: DRAFT
    depends_on: [F001, F002, F006, F007]
    blocking:
      - "OPEN-003 未确认（Service 字段范围）"
      - "依赖 F001 / F002 / F006 / F007 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-SVC-001
      - R-SVC-002
      - R-SVC-003
      - R-SVC-004
      - R-SVC-005
      - R-SVC-006
    acceptance_criteria:
      - Service Name / Type 等产品字段允许按实际服务自由登记，不强制固定类别（R-SVC-001）。
      - Service 必选绑定运行载体（BareMetal / VirtualMachine / Container），不允许存在未绑定任何运行载体的 Service（R-SVC-005）。
      - 一个 Service 可绑定多个运行载体，并可通过绑定跨 Cluster 的多个载体实现被多个 Cluster 共享（R-SVC-002, R-SVC-005, R-SVC-006）。
      - 共享服务只登记一次，模型能表达 Service N:N Cluster 或等价语义（R-SVC-003）。
      - Service 与 Cluster 的关联由运行载体的 Cluster 归属推导，不设计为强制 service.cluster_id（R-SVC-004, R-SVC-006）。
      - Service 在 V1 不设状态（Q-002=B）。
    open_questions:
      - "OPEN-003：Service 字段（URL / Port / Protocol / Owner / Description / Credential reference / Health information 等）范围。"

  # ---- E05 资源查询与视图 ----
  - id: F009
    name: Cluster 视角资源查询
    epic: E05
    priority: P0
    status: BLOCKED
    depends_on: [F001, F002]
    blocking:
      - "依赖 F001 / F002 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-QUERY-001
      - R-QUERY-002
      - R-QUERY-004
    acceptance_criteria:
      - 用户能够从 Cluster 视角查看其所属资源（R-QUERY-001）。
      - 支持查看 Cluster → BareMetal 以及 BareMetal 的状态（R-QUERY-002）。
      - 查询结果区分 Resource Not Found 与 Empty Relationship（R-QUERY-004）。
    open_questions: []

  - id: F010
    name: 资源详情与关联查询
    epic: E05
    priority: P1
    status: BLOCKED
    depends_on: [F001, F002, F004, F005, F006, F007, F008]
    blocking:
      - "依赖多个资源 Feature 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-QUERY-003
      - R-QUERY-004
      - "§15 Resource Relationship"
    acceptance_criteria:
      - 能查询与 BareMetal 相关的 NetworkInterface / IPAddress / VirtualMachine / Container / Service（R-QUERY-003）。
      - 查询结果区分 Resource Not Found 与 Empty Relationship（R-QUERY-004）。
      - 用户无需为获得一个资源的基本信息而跨多个独立 Excel 式页面手工拼接（R-QUERY-003）。
      - 页面组织由 Frontend 设计，不在本计划中固化（R-QUERY-003）。
    open_questions: []

  # ---- E06 数据导入 ----
  - id: F011
    name: Excel 模板与批量导入
    epic: E06
    priority: P1
    status: BLOCKED
    depends_on: [F001, F002, F004, F005, F006, F007, F008]
    blocking:
      - "依赖多个资源 Feature 未 DONE"
    product_document: docs/product/requirements.md
    requirements:
      - R-IMPORT-001
      - R-IMPORT-002
      - R-IMPORT-003
      - R-IMPORT-004
    acceptance_criteria:
      - 提供明确的 Excel 导入模板（R-IMPORT-001）。
      - 导入执行与页面人工录入一致的业务校验，不得绕过唯一性 / 必填 / 资源关系 / IP 冲突 / 合法状态值（R-IMPORT-002）。
      - 导入失败时明确指出哪一行、哪一个字段、什么原因（R-IMPORT-003）。
      - 导入为 All-or-Nothing：任一行失败则整个导入不产生任何写入，且一次性报告全部失败行（R-IMPORT-004）。
    open_questions: []

# ---------------------------------------------------------------------------
# Blocking Decisions
# C-1 ~ C-8 来自 docs/project/_planning-findings.md。
# Project Manager 不得自行裁定；须由用户/产品/架构流程解决。
# ---------------------------------------------------------------------------
decisions_required:
  - id: DEC-001
    question: >
      领域模型 domain-model.md 仍含 DataCenter 且规定 Cluster→DataCenter 绑定必选、
      DataCenter 名称全局唯一；requirements.md §6 明确 V1 不建立 DataCenter 层级。
      需确认以 requirements.md 为准，并安排 domain-model.md 的修正范围（修正不属于本计划）。
    impact_features: [F001, F002, F009, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：依用户明确指令，V1 不含 DataCenter，以 requirements.md §6 为准；
      domain-model.md 已同步移除 DataCenter（Cluster 为基础设施顶层对象）。
      F001/F002/F009/F010/F011 验收标准均不含 DataCenter 维度。

  - id: DEC-002
    question: >
      requirements.md §13 定义 Rack 与 U 位冲突硬阻断，但 domain-model.md 的 taxonomy /
      关系 / 唯一性完全不含 Rack。需确认 Rack / U 位是否进入 V1 领域模型，以及领域模型文档如何同步。
    impact_features: [F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：Rack / U 位已从 V1 产品范围删除（requirements.md §13 改为「V1 不管理 Rack 与 U 位」，
      原 4 条 Rack 规则（R-RACK 序列）全部删除）。对应 Feature F003 一并删除。

  - id: DEC-003
    question: >
      Service 关系模型冲突：requirements.md（Service N:N Cluster，可被多 Cluster 共享，
      不得强制 service.cluster_id）vs domain-model.md（Service 绑定 VM/Container/BareMetal 运行载体，必选）。
      两套模型互斥，需确认 V1 采用哪一种。
    impact_features: [F008, F010, F011]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：采用方案 C。Service 必选绑定运行载体（BareMetal / VM / Container），可绑定多个；
      Service 与 Cluster 的关联由载体归属推导。已落为 requirements.md R-SVC-005 / R-SVC-006，
      domain-model.md §5.5 / §6 同步确认。F008 相应依赖 F006 / F007。

  - id: DEC-004
    question: >
      VirtualMachine 与物理宿主关系模型的强制性及生命周期规则：requirements.md R-VM-003 要求
      在 Feature Product 阶段确认，domain-model.md 规定 VM→BareMetal 必选。需确认。
    impact_features: [F006, F007, F010, F011]
    type: product
    status: DEFERRED_TO_FEATURE
    resolution: >
      DEFERRED_TO_FEATURE（2026-09-15）：归属 F006 Product 阶段（依据 requirements.md R-VM-003 原意），
      不再作为项目级阻塞；已记录为 F006 的 Feature 级 open_question。

  - id: DEC-005
    question: >
      Container 登记粒度、生命周期与运行关系（绑定 VM / BareMetal 是否必选）：
      requirements.md §10 要求在 Feature 阶段确认，domain-model.md 规定必选。需确认。
    impact_features: [F007, F010, F011]
    type: product
    status: DEFERRED_TO_FEATURE
    resolution: >
      DEFERRED_TO_FEATURE（2026-09-15）：归属 F007 Product 阶段（依据 requirements.md §10），
      不再作为项目级阻塞；已记录为 F007 的 Feature 级 open_question。

  - id: DEC-006
    question: >
      VM / Container / Service / NetworkInterface / IPAddress 的状态模型未在 requirements.md 确认
      （仅确认 BareMetal 状态与 Cluster 无状态）。domain-model.md §7.2/§7.3 定义了这些状态枚举。
      需确认这些状态是否属于 V1 已确认需求。
    impact_features: [F004, F005, F006, F007, F008]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：采用方案 B。V1 仅 BareMetal 有状态；VM / Container / Service /
      NetworkInterface / IPAddress 均不设状态。domain-model.md §7 已重写同步。

  - id: DEC-007
    question: >
      Cluster 名称不得包含 `/` 的规则来源不明：domain-model.md §5.1/§8 有该规则（用于 URL 路径寻址），
      requirements.md 未提及。需确认是否为已确认产品规则。
    impact_features: [F001]
    type: product
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15）：确认为 V1 产品规则，已落为 requirements.md R-CLUSTER-005
      （Cluster 名称不得包含 `/`，写入路径强制校验拒绝）。

  - id: DEC-008
    question: >
      domain-model.md §4 将信息分为静态/动态并采用通用 status 统一建模，且声明所有绑定必选；
      requirements.md §16/§21 未如此表述。需确认是否采纳该统一建模方式。
    impact_features: [F006, F007, F008]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0002 ACCEPTED）：统一 `status` 建模已由架构裁定 ——
      `bare_metal.status` 为显式列 + CHECK（IDLE/ALLOC/DOWN/UNKNOWN），**不设通用 status 表**；
      其余资源在 V1 不设状态。符合 requirements.md §4（不同资源可有独立数据模型与状态）
      与 §24（禁止 EAV / 通用 resources 表 / STI / JSONB 万能模型）。

  - id: DEC-009
    question: >
      项目技术栈与整体架构未确定：无 docs/architecture/、无 ADR、无技术选型。
      这是所有 Feature 的前置阻塞。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012, F013, F014, F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0001 ACCEPTED）：技术栈为 Python + FastAPI + Pydantic +
      SQLAlchemy 2.x + Alembic；Vue 3 + TypeScript + Vite + Element Plus；单体分层架构。
      API 契约部分见 DEC-014 / ADR-0003。

  - id: DEC-010
    question: >
      数据库选型、持久化方案、Schema 设计与迁移策略未确定：无 docs/database/、无 Migration。
      需经 Architecture / Database 流程决策。
    impact_features: [F004, F005, F006, F007, F008, F012, F015]
    type: database
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0002 ACCEPTED）：采用 PostgreSQL；大小写敏感唯一性由显式
      collation / 数据库默认行为保证（以测试固定）；“已删不占唯一性”由 partial unique index
      (`WHERE deleted_at IS NULL`) 保证；Alembic 版本化向前 migration。
      DEC-015 规模假设（10⁵ / 50 并发）在该选型阈值内，无需重审。

  - id: DEC-011
    question: >
      全局资源标识与 URL 寻址策略未确定（资源主键方案、按名称寻址等），影响所有资源 CRUD 与查询。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0003 ACCEPTED）：所有资源使用不可变 BIGINT identity 代理主键 `id`；
      写操作一律走 `id` 路径；Cluster 额外提供 `by-name` 只读路径别名（大小写敏感，已删不参与解析）。

  - id: DEC-012
    question: >
      逻辑删除的持久化实现方式（删除标记字段等）与「已删除资源不占用唯一性」的释放语义细节未确定。
    impact_features: [F014, F001, F002, F004, F005, F006, F007, F008]
    type: database
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0004 ACCEPTED）：所有资源表使用单一 `deleted_at TIMESTAMPTZ NULL`；
      常规查询一律带 `deleted_at IS NULL`；“已删不占唯一性”由 partial unique index 保证；
      父删子拦、不级联在同一事务内加行锁实现。

  - id: DEC-013
    question: >
      本地账号认证的具体实现范围（口令策略、会话机制、最小权限边界）未确定；
      requirements.md 仅确认使用本地账号且不扩大为复杂 RBAC。
    impact_features: [F013, F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0005 ACCEPTED）：服务端会话（DB 会话表 + HttpOnly Cookie）+
      Argon2id 口令哈希；V1 仅「已认证 / 未认证」两种边界，不做 RBAC。

  - id: DEC-014
    question: >
      API 契约与错误响应规范未确定：无 docs/api/。需统一冲突/校验错误的返回结构，
      以支撑 §21 数据一致性与 R-IMPORT-003 的逐行错误提示。
    impact_features: [F001, F002, F004, F005, F006, F007, F008, F009, F010, F011, F012]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，ADR-0003 ACCEPTED）：REST + JSON + `/api` 前缀；自定义 Problem 风格错误信封
      + 稳定 `code`；逐行错误用 `details[].row/.field/.code` 承载 R-IMPORT-003；集合空返回 200 空数组、
      父不存在返回 404（R-QUERY-004）；导入语义为 All-or-Nothing。规范落盘 docs/api/api-conventions.md（READY）。

  - id: DEC-015
    question: >
      资源规模量级与并发假设未确定（BQ-1）：影响数据库选型与部署配置是否需要分区 / 异步导入。
    impact_features: [F012, F015]
    type: process
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，用户裁定）：资源总量约 10⁵（10 万级），并发用户约 50。
      结论来自用户确认；在该阈值内单机 PostgreSQL 足够，DEC-010 选型无需重审。
      见 csm-v1-foundation-architecture.md「规模假设与阈值」。

  - id: DEC-016
    question: >
      部署打包方式未确定（BQ-4）：影响 F015 内网部署的交付形态。
    impact_features: [F015]
    type: architecture
    status: RESOLVED
    resolution: >
      RESOLVED（2026-09-15，用户裁定，ADR-0001 ACCEPTED）：采用 docker-compose 打包
      （nginx + 应用 + PostgreSQL）。原架构建议为 systemd + nginx，用户改为 docker-compose。

