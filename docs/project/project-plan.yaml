      并在 requirements.md §16 新增一条关键字搜索产品规则（NQ-8，Product 职责）。
      **DEC-020 未被改动。**
    topic: 是否新增「集群内任意关键字查询」能力，以及是否因此修订四份既有契约的关键字 / 筛选立场
    question: >
