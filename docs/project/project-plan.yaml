      - "AC-47 登记侧同事务对每一个载体行取共享锁并确认活跃；任一未命中 → 拒绝登记（不留无主 Service、不留部分绑定）；多载体锁顺序必须确定以避免死锁。"
      - "AC-48 不存在解绑路径：绑定写入路径恰两条——登记建立、Service 软删释放。"
