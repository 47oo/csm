    acceptance_criteria:
      - AC-01 未认证不得访问受保护端点：任意 /api/* 资源端点 → 401 UNAUTHENTICATED，不返回任何资源数据（R-AUTH-001）。
      - AC-02 登录成功后获得访问能力：正确凭据登录后 GET /api/clusters → 200。
      - AC-03 口令错误不建立会话且失败响应统一：口令错误与账号不存在返回完全相同的响应，无法判断用户名是否存在（R-AUTH-006）；均不建立会话；无口令明文泄露。
      - AC-04 登出使会话失效：登出后同一客户端访问受保护端点 → 401 UNAUTHENTICATED，会话不可复用。
      - AC-05 会话失效时前端回到登录页：收到 401 UNAUTHENTICATED 时回登录页，不显示资源数据。
      - AC-06 登录页拦截未登录访问：未登录访问受保护页面 → 登录页；凭据正确进入系统，错误则停留并提示。
      - AC-07 账号禁用即时生效：active=false 的账号无法登录，既有会话不再可用（可用绕过应用层置位 active 验证）。
      - AC-08 不存在自助注册入口：无任何允许未认证用户创建账号的端点或页面。
      - AC-09 仅两态、无 403 触发路径：不存在角色 / 权限 / RBAC 的表、列、端点，也无任何触发 403 的产品路径（R-AUTH-003）。
      - AC-10 口令不以明文存储或泄露：库中无口令明文；明文字符串不出现在日志与错误响应中。
      - AC-11 初始账号可建立且可登录：按仓库文档化步骤建立初始账号后可成功登录并访问受保护端点。
      - AC-12 /api/clusters* 行为变更为认证保护且已记录：未认证访问一律 401，变更写入交接文档并作为 F015 部署文档输入。
