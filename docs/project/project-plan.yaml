decisions_required:
  - id: D-ARCH-STACK
    kind: ARCHITECTURE
    status: OPEN
    question: 后端/前端技术栈、语言、框架与运行时版本。
    reason: AGENTS.md §2.9 不得默认技术栈；当前无已批准架构决策。
    required_by: 实现前（所有 Feature）
    affects: [ALL]
  - id: D-ARCH-DB
    kind: ARCHITECTURE
    status: OPEN
    question: 数据库选型、约束与 Migration 策略；展示口径与存储口径一致性策略。
    reason: 唯一性与并发保护需数据库最终保证；domain-model §1 标记 OPEN。
    required_by: 数据库设计前（F001/F002/F004/F005/F006/F007/F009）
    affects: [F001, F002, F004, F005, F006, F007, F009]
  - id: D-ARCH-API
    kind: ARCHITECTURE
    status: OPEN
    question: API 风格、契约规范与错误语义约定。
    reason: 各 Feature 需要 API Contract 才能实施，当前无批准 Contract。
    required_by: CONTRACT 阶段前（所有 Feature）
    affects: [ALL]
  - id: D-ARCH-DEPLOY
    kind: ARCHITECTURE
    status: OPEN
    question: 部署架构、内网访问与环境拓扑。
    reason: 需求 §9.1 仅要求内网访问，未确认部署形态。
    required_by: 实现/部署前
    affects: [ALL]
  - id: D-Q3
    kind: PRODUCT
    status: OPEN
    question: 裸金属 CPU/内存/GPU/SN、VM vCPU/内存等专有属性的必填范围。
    reason: requirements §1.3、§11.2 Q3；domain-model §7。
    required_by: 类型详情实现前
    affects: [F002, F003, F004]
  - id: D-Q5
    kind: PRODUCT
    status: OPEN
    question: 同集群网段重叠仅提示风险还是禁止写入（当前暂定仅提示）。
    reason: requirements §4.6.5、§11.2 Q5（PROPOSED）。
    required_by: 网段/IP 写校验实现前
    affects: [F005, F006]
  - id: D-STATUS-SOURCE
    kind: PRODUCT
    status: OPEN
    question: 计算资源“状态来源”的具体语义——记录操作者还是来源系统。
    reason: requirements §4.3、domain-model §4。
    required_by: 状态展示实现前
    affects: [F002, F003]
  - id: D-IP-SEMANTICS
    kind: PRODUCT
    status: OPEN
    question: IP 实体语义细节（归属表达、历史/释放表达）。
    reason: domain-model §2 标记 IP 语义细节 OPEN。
    required_by: IP/宿主关系实现前
    affects: [F004, F006]
  - id: D-BQ-E
    kind: PRODUCT
    status: OPEN
    question: “服务类型”“节点角色”是否为受控枚举及其取值集。
    reason: requirements §11.2 BQ-E。
    required_by: 服务页与实例实现前
    affects: [F007]
  - id: D-BQ-F
    kind: PRODUCT
    status: OPEN
    question: 认证源、审计保留周期、备份与恢复演练、正式延迟目标（部署阶段裁定）。
    reason: requirements §2.1、§9.1–§9.3、§11.2 BQ-F。
    required_by: 权限审计与非功能验收前
    affects: [F009, F011]

# --- Milestones：按产品可交付能力组织 ---
milestones:
  - id: M1
    title: 集群与计算资源基础台账
    goal: 打通集群登记、计算资源一次录入、统一列表与详情，可替代核心 Excel 台账。
    features: [F001, F002, F003]
    exit_criteria: requirements-v2.md §10 场景 1–9、32–34 通过；一次提交原子性与名称唯一生效。
  - id: M2
    title: 网段与 IPv4 分配台账
    goal: 集群多网段维护、保留地址与 IPv4 手动/自动分配闭环。
    features: [F005, F006]
    exit_criteria: requirements-v2.md §10 场景 10–12、19–31 通过；并发与耗尽场景在基线环境验证。
  - id: M3
    title: 类型详情、宿主关系与服务部署
    goal: 打通裸金属/VM 专有详情、宿主双向关系与服务部署实例关联。
    features: [F004, F007]
    exit_criteria: requirements-v2.md §10 场景 13–18、35–36 通过；VM 宿主约束与服务集群约束生效。
  - id: M4
    title: 统一检索、权限审计与集群聚合
    goal: 落实全量模糊搜索规范、三角色服务端鉴权审计与集群聚合概览。
    features: [F008, F009, F010]
    exit_criteria: requirements-v2.md §10 场景 37–41 通过；§8、§9.1 生效。
  - id: M5
    title: 非功能与可用性基线
    goal: 在约 1000 台/集群基线上验证分页、可靠性、原子性与可用性要求。
    features: [F011]
    exit_criteria: requirements-v2.md §9.2–§9.4 与场景 7、9、22、23、39 通过。

