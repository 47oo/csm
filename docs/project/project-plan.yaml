# --- 需要用户裁定的决策 ---
# 影响 Feature 的架构/产品前提，在对应阶段前必须由用户或架构阶段裁定并记录。
# 状态：OPEN / RESOLVED。RESOLVED 条目保留以记录历史，不再列入 Feature.blocking_decisions。
decisions_required:
  - id: D-ARCH-STACK
    kind: ARCHITECTURE
    status: OPEN
    question: 后端/前端技术栈、语言、框架与运行时版本。
    reason: AGENTS.md §2.9 不得默认技术栈；当前无已批准架构决策。
    required_by: 实现前（所有 Feature）
    affects: [ALL]
  - id: D-ARCH-DB
    kind: ARCHITECTURE
    status: OPEN
    question: 数据库选型、约束与 Migration 策略；展示口径与存储口径一致性策略。
    reason: 唯一性与并发保护需数据库最终保证；domain-model §1 标记展示/存储一致性交架构。
    required_by: 数据库设计前（F001/F002/F004/F005/F006/F007/F009）
    affects: [F001, F002, F004, F005, F006, F007, F009]
  - id: D-ARCH-API
    kind: ARCHITECTURE
    status: OPEN
    question: API 风格、契约规范与错误语义约定（含整单原子提交与并发冲突的表达）。
    reason: 各 Feature 需要 API Contract 才能实施，当前无批准 Contract；requirements §4.5 不规定 HTTP 方法。
    required_by: CONTRACT 阶段前（所有 Feature）
    affects: [ALL]
  - id: D-ARCH-DEPLOY
    kind: ARCHITECTURE
    status: OPEN
    question: 部署架构、内网访问与环境拓扑。
    reason: 需求 §9.1 仅要求内网访问，未确认部署形态。
    required_by: 实现/部署前
    affects: [ALL]
  - id: D-Q3
    kind: PRODUCT
    status: OPEN
    question: 裸金属 CPU/内存/GPU/SN、VM vCPU/内存等专有属性的必填范围、表示含义与单位。
