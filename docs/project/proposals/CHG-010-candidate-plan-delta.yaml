- id: F028
  title: 范围变更集成验收与回归
  kind: FEATURE
  priority: P0
  milestone: M19 范围变更集成验收
  scope: >-
    在真实 Docker Compose 环境（Nginx → Frontend / FastAPI → PostgreSQL）对 CHG-010 新增范围做集成验收，并回归既有能力。
    范围含：准备多角色 / 多集群 / 多授权组合的验收数据（ADMIN、无授权非 ADMIN、单集群授权、多集群授权、撤销后账号、API Key
    绑定账号），在真实环境执行拟新增 T85-T99；执行既有 T01-T84 的关键回归子集（至少覆盖唯一性、跨 Cluster 关系、软删与恢复、
    Audit 与 Activity、权限矩阵、编辑版本冲突、导入两步流程与整批回滚、全局搜索字段组合、Dashboard 容量口径、二次确认与 API
    Key 认证）；核对前端在受限范围下的列表 / 详情 / 搜索 / Dashboard / System 授权页表现（空态、无越权入口、错误提示）；核实
    迁移与回填在真实数据量下的结果与可回滚性；更新候选 revision 的整体验收证据并把 project.acceptance 由 PENDING 置
    COMPLETE（由协调器核验后写入）。明确不做：新增业务规则或绕过已签核设计；改写 F001-F025 的已交付范围与证据；以本 Feature
    名义提交未在 F026 / F027 设计内的行为变更；把未实际执行的项目写成 PASS。
  acceptance: >-
    映射 §31 / §32 与 T85-T99（均 PROPOSED）。docker compose up -d 可在真实环境完成启动并跑通新增范围验收；T85-T99 全部
