  affects:
  - F027
  - F028
  owner: 用户
  basis: 非 ADMIN 是否永不可见已删除对象（推荐：永不，即使被授权该 Cluster；ADMIN 仍按 §21 查看与恢复）。
- id: CHG010-BQ07
  source: docs/product/requirements-v3.md#232-集群范围授权（PROPOSED）
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F027
  - F028
  owner: 用户
  basis: 未授权集群是否完全不可见（推荐：是；不得通过列表 total、Dashboard 计数、搜索结果或错误信息推断其存在）。
- id: CHG010-BQ08
  source: docs/product/requirements-v3.md#232-集群范围授权（PROPOSED）
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  owner: 用户
  basis: 迁移回填是否为「既有非 ADMIN × 既有 Cluster」全量建立授权（推荐：是，避免上线即造成非 ADMIN 数据雪崩式不可见）；
    回填是否含软删 Cluster 见 CHG010-BQ14。
- id: CHG010-BQ09
  source: docs/product/requirements-v3.md#232-集群范围授权（PROPOSED）
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  owner: 用户
  basis: 是否仅 ADMIN 可管理授权（推荐：是，复用 §23「用户、角色、系统设置」权限，不新增权限项）。
- id: CHG010-BQ10
  source: docs/product/requirements-v3.md#232-集群范围授权（PROPOSED）
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F027
  owner: 用户
  basis: 新建 Cluster 的默认授权（原 U1）。推荐：创建时不自动授权给任何非 ADMIN，仅创建者（ADMIN）可见，由 ADMIN 显式授予；
    备选为自动授予创建者或全部非 ADMIN。
- id: CHG010-BQ11
  source: docs/project/proposals/CHG-010-cluster-access.md#u2-admin-降级
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  owner: 用户
  basis: ADMIN 降级为非 ADMIN 时的范围（原 U2）。推荐：立即按该账号既有授权行解析（可能为零授权），不做隐式补偿；是否需要在降级前
    强制校验授权数需明确。
- id: CHG010-BQ12
  source: docs/project/proposals/CHG-010-cluster-access.md#u3-撤销历史
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  - F028
  owner: 用户
  basis: 撤销是否保留 revoked_at / 撤销操作者历史（原 U3）。推荐：保留，撤销为状态变更而非物理删除，重新授予产生新记录或重置撤销标记需
    明确。
- id: CHG010-BQ13
  source: docs/project/proposals/CHG-010-cluster-access.md#u4-错误语义
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F027
  owner: 用户
  basis: 越权访问返回 404 还是 403（原 U4）。推荐：对非 ADMIN 的未授权对象统一 404（不泄露存在性），与 §23 的 401 / 403
    语义及既有错误码契约的兼容方式需确认。
- id: CHG010-BQ14
  source: docs/project/proposals/CHG-010-cluster-access.md#u5-零授权-dashboard
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  - F027
  - F028
  owner: 用户
  basis: 零授权非 ADMIN 的 Dashboard / 搜索 / 列表行为（原 U5）。推荐：返回显式空态（计数 0、空结果、页面提示无授权集群），不报错
    也不回退为全局。
- id: CHG010-BQ15
  source: docs/project/proposals/CHG-010-cluster-access.md#u6-软删-cluster-回填
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  owner: 用户
  basis: 回填是否包含软删 Cluster（原 U6）。推荐：包含，使恢复后行为与回填前一致；若排除，需明确恢复后是否自动补授权。
- id: CHG010-BQ16
  source: docs/project/proposals/CHG-010-cluster-access.md#u8-导入与推送同口径
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F027
  owner: 用户
  basis: 导入 / 批量绑定 / 采集脚本 --push 是否与普通 API 同口径（原 U8）。推荐：完全同口径，预校验与写入均按行做范围校验并给出行号
    级拒绝原因，不提供「导入绕过范围」的特例。
- id: CHG010-BQ17
  source: docs/project/proposals/CHG-010-cluster-access.md#u7-admin-授权行
  status: OPEN
  kind: BUSINESS_DECISION
  affects:
  - F026
  - F027
  owner: 用户
  basis: 是否允许为 ADMIN 建立授权行（原 U7，与 CHG010-BQ01 弱相关但不重复：本项决定数据层是否接受此类行，BQ01 决定 ADMIN
    是否受范围限制）。推荐：不接受，授权行的存在意义仅对非 ADMIN 生效。
- id: CHG010-BQ18
  source: docs/project/proposals/CHG-010-cluster-access.md#专业设计输入
  status: OPEN
  kind: DESIGN_INPUT
  affects:
  - F026
  - F027
  owner: Architect / Database
  basis: 专业可定（当前未签核）：授权表名与列、主键 / 唯一约束（user_id + cluster_id）、外键与软删联动、索引设计、迁移与回填实现方式、
    AccessScope 的类型与逐请求解析位置、范围过滤的查询实现（JOIN / EXISTS / 子查询）、是否引入物化或缓存。推荐在 F026
    DATABASE Gate 与 F027 CONTRACT 一并签核，不提交用户裁定。
- id: CHG010-BQ19
  source: docs/project/proposals/CHG-010-cluster-access.md#专业设计输入
  status: OPEN
  kind: DESIGN_INPUT
  affects:
  - F026
  - F027
  owner: Architect / Backend
  basis: 专业可定（当前未签核）：授权列表的分页与排序口径、System 授权 UI 的展示与批量操作范围、受限列表的默认排序与分页语义是否保持不变、
    total 的计算方式。推荐保持既有列表契约收敛口径，不改变既有排序 / 分页语义。

pending_changes:
- id: CHG-010
  proposal: docs/project/proposals/CHG-010-cluster-access.md
  affects: ALL
  status: PENDING_APPROVAL
  note: 由协调器登记；批准前暂停 F026-F028 调度与相关写入，F001-F025 不受影响且保持 DONE。

dependency_and_milestone_notes:
  new_milestones:
  - id: M17
    title: 集群范围授权基座
    features:
    - F026
    rationale: 先建立授权事实、迁移回填、ADMIN 管理入口与统一 AccessScope，作为后续强制执行的唯一依据；本身可独立验收且不改变既有端点可见范围。
  - id: M18
    title: 服务端范围强制执行
    features:
    - F027
    rationale: 在既有 11 域读写路径上一次施加范围约束并封闭信息泄露面；必须整体合并，不能形成部分端点受限的安全中间态。
  - id: M19
    title: 范围变更集成验收
    features:
    - F028
    rationale: 新增范围属于跨域横切能力，其正确性只能在真实 Compose 上以多角色 / 多授权组合整体验证，并由其承接候选 revision 14 的整体验收。
  critical_path:
  - F026 → F027 → F028
  dependency_edges:
  - F026 depends_on F002, F003, F015, F017
  - F027 depends_on F026
  - F028 depends_on F026, F027
  acyclic_check: F026 / F027 / F028 仅形成单链依赖，无环；F001-F025 的既有依赖边不变。
  why_f027_cannot_be_split:
  - 范围过滤是横切安全约束，只要存在任一未受限的列表 / 详情 / 聚合 / 搜索 / Dashboard / 导入读路径，非 ADMIN 即可通过该路径枚举未授权集群的数据，形成真实泄露。
  - 仅靠端点数量拆分会产生「已限制」与「未限制」共存的合并中间态，该中间态在上线意义上不安全，也无法用「部分完成」表达验收。
  - 跨对象父级派生（IP / Endpoint / 明细 / 未绑定 IP）与搜索 total、Dashboard 计数属于同一信息面，拆开会让计数与明细口径互相矛盾，回归无法判定。
  - 因此按「一次合并、整体验收」定义 F027，其内部可按域分批实现，但合并与验收以整体为准。
  verification_carry_over:
  - F028 承接候选 revision 14 的整体验收（project.acceptance 由 PENDING 回到 COMPLETE），保留 F016 既有验收证据并新增 T85-T99 与本 Feature 回归证据。
  - T85-T99 为 PROPOSED 新用例，编号连续接在既有 T01-T84 之后；获批前不写入 requirements §31。
  reuse_and_no_invalidation:
  - F001-F025 保持 DONE、Git / Test / Review 证据不变；本变更不重写其范围、验收与交付证据。
  - F026 复用 F002 的权限矩阵与操作者上下文、F003 的 Cluster 与软删横切、F015 的 Audit 查询与 ADMIN 系统页、F017 的 API Key 认证解析。
  - F027 复用 F013 / F018 的搜索与字段组合、F014 / F023 的导入两步流程与整行归因、F019 / F022 的接口侧与详情只读查询、F025 的 --push 通路。
  - F028 复用 F016 的验收脚本骨架与备份 / Audit 覆盖口径。
  - 既有 DONE Feature 的测试用例在范围变更生效后语义可能变化（例如原本全局可见的列表变为范围内可见），其既有证据不被改写；若出现真实回归，由 F028 记录并作为修复输入，而不是回退 DONE。

risks:
- id: R-CLUSTER-01
  risk: 与需求 §3 / §23 / §23.1 已批准的排除项直接冲突；若未走变更控制即实现，会形成与权威需求矛盾的代码与批准记录。
  mitigation: 按 change-control §4 以 proposal 分支与 pending_changes 处理，未获批前不实现、不改写需求正文与基线。
- id: R-CLUSTER-02
  risk: 一旦任一读路径遗漏范围过滤，非 ADMIN 可枚举未授权集群数据，安全收益被整体抵消。
  mitigation: F027 一次合并、整体验收；以「端点清单 + 域清单」双向核对，并由 F028 在多授权组合下验证 total / 计数 / 搜索 / 导入。
- id: R-CLUSTER-03
  risk: 回填口径不当导致上线后非 ADMIN 立即看不到既有数据，或回填遗漏既有 Cluster 造成不可解释的空视图。
  mitigation: 回填口径与计数核对写入 F026 验收；F028 在真实数据量下核对回填结果与可回滚性。
- id: R-CLUSTER-04
  risk: 计数、搜索 total 或错误信息泄露未授权对象的存在性，与 404 / 403 选择不一致。
  mitigation: 把「不泄露存在性」写成 F027 的可观察验收项，并让 F028 专门验证零授权与单授权场景。
- id: R-CLUSTER-05
  risk: 撤销 / 降级后因缓存或会话状态导致范围未即时收敛，形成越权残留。
  mitigation: 明确逐请求解析 AccessScope、不缓存跨请求授权结果；F028 验证撤销与降级后的即时行为。
- id: R-CLUSTER-06
  risk: 前端在受限范围下出现无授权入口或空态被误判为错误，造成体验与支持成本。
  mitigation: F027 明确前端沿用既有空态 / 错误态口径，F028 核对受限场景页面表现。
- id: R-CLUSTER-07
  risk: 范围变更使既有 T01-T84 用例的预期在语义上不再等价，若直接复用旧预期会得到假通过或假失败。
  mitigation: F028 明确关键回归子集与预期调整依据，只记录真实执行结果，不复制历史结论。
- id: R-CLUSTER-08
  risk: 决策长期未裁定导致 F026 / F027 卡在 DRAFT，进而阻塞整体验收。
  mitigation: 决策集中在 17 项业务裁定与 2 项专业设计输入，按阻塞粒度标注 affects；优先裁定 BQ01 / BQ02 / BQ03 / BQ07 / BQ08。

open_questions:
- id: OQ-CLUSTER-01
  question: 授权粒度是否只到 Cluster，还是需要后续扩展到 Cluster + 资源类型或单个 Resource？
  current: 候选仅 Cluster 级；资源实例级明确排除。
- id: OQ-CLUSTER-02
  question: 是否需要「授权变更历史」的独立视图，还是仅依赖 Audit 查询即可？
  current: 候选仅依赖 Audit（CHG010-BQ05）。
- id: OQ-CLUSTER-03
  question: 是否需要在 System 页面提供按用户 / 按集群两个方向的授权查看？
  current: 列为 CHG010-BQ19 的专业设计输入，未决定。
- id: OQ-CLUSTER-04
  question: 新增集群是否通知 ADMIN 或提供「未授权用户清单」提示？
  current: 候选不做通知能力，避免引入新子系统。
- id: OQ-CLUSTER-05
  question: 若未来引入组织 / 租户模型，当前授权表是否可作为扩展基座？
  current: 候选仅保持数据可扩展，不预建组织结构。
- id: OQ-CLUSTER-06
  question: 是否需要限制「ADMIN 降级」操作的可用性（如要求先转移授权）？
  current: 推荐不限制并即时按授权行解析（CHG010-BQ11），待用户确认。