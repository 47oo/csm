# F001 前端容器 Nginx 配置（架构 §1.1：SPA history fallback + 静态资源缓存基础配置）。
# 仅服务静态产物；/api/ 路由由入口 Nginx（deploy/nginx）代理到 backend，不在此处理。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 带内容哈希的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口不缓存，保证发布后浏览器取到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history fallback：其余路径一律回落到 index.html
    location / {
        try_files $uri /index.html;
    }
}
