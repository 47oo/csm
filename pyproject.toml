[project]
name = "csm-backend"
version = "0.1.0"
description = "CSM — HPC/AI 资源管理平台后端（F012 基座）"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "database: tests that require a live PostgreSQL database (skipped without a DSN)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]